      --border: #2a303b;

      --text-dim: #9aa4b2;
      --text-faint: #6b7482;
      --accent: #7d9bd4;
      --accent-soft: #1c2740;
      --good: #4cd0a0;
      --good-soft: #123128;
      --bad: #f2697c;
      --bad-soft: #3a1620;
      --warn: #d9a860;

      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 18px rgba(0, 0, 0, 0.25);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1116;
    --surface: #161a21;
    --surface-2: #1d222b;
    --border: #2a303b;
    --text: #e7eaee;
    --text-dim: #9aa4b2;
    --text-faint: #6b7482;
    --accent: #7d9bd4;
    --accent-soft: #1c2740;
    --good: #4cd0a0;
    --good-soft: #123128;
    --bad: #f2697c;
    --bad-soft: #3a1620;
    --warn: #d9a860;
    --warn-soft: #362a12;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 18px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #faf9f7;
    --surface: #ffffff;
    --surface-2: #f5f4f1;
    --border: #ececec;
    --text: #1a1a1a;
    --text-dim: #6b6b6b;
    --text-faint: #9a9a94;
    --accent: #4c6fa5;
    --accent-soft: #ebf1f8;
    --good: #2e7d5b;
    --good-soft: #e7f4ee;
    --bad: #c0392b;
    --bad-soft: #fbeae7;
    --warn: #a8752e;
    --warn-soft: #faf1de;
    --shadow: 0 1px 2px rgba(20, 20, 20, 0.04), 0 6px 16px rgba(20, 20, 20, 0.05);
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
  }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, ui-sans-serif, system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .num, .mono, td.num, .price, .pct, .dollar {
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
  }
  h1, h2, h3 { text-wrap: balance; margin: 0; }
  a { color: var(--accent); }
  button { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  /* ---------- Sticky top bar ---------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 2px 10px rgba(20, 20, 20, 0.04);
  }
  .topbar-inner {
    max-width: 1080px;
    margin: 0 auto;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 32px;
    flex-wrap: wrap;
  }
  .topbar-brand {
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.01em;
    color: var(--text);
    white-space: nowrap;
    margin-right: 4px;
  }
  .topbar-metric { display: flex; flex-direction: column; gap: 3px; }
  .topbar-metric .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-faint);
  }
  .topbar-metric .value { font-size: 19px; font-weight: 600; letter-spacing: -0.01em; }
  .topbar-date { margin-left: auto; font-size: 12.5px; color: var(--text-faint); white-space: nowrap; }

  .good { color: var(--good); }
  .bad { color: var(--bad); }
  .neutral { color: var(--text-dim); }

  /* ---------- Tabs ---------- */
  .tabs {
    max-width: 1080px;
    margin: 0 auto;
    display: flex;
    gap: 4px;
    padding: 12px 24px 10px;
  }
  .tab-btn {
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 14px;
    font-weight: 600;
    padding: 9px 16px;
    cursor: pointer;
    border-radius: var(--radius-sm);
    transition: background 0.15s ease, color 0.15s ease;
  }
  .tab-btn:hover { background: var(--surface-2); color: var(--text); }
  .tab-btn.active { color: var(--accent); background: var(--accent-soft); }

  main { max-width: 1080px; margin: 0 auto; padding: 24px; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .section-title {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-faint);
    margin: 30px 0 14px;
  }
  .section-title:first-child { margin-top: 0; }

  /* ---------- Cards ---------- */
  .card {
    background: var(--surface);
    border: none;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .grid-4 {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
  }
  .stat-card { padding: 18px; display: flex; flex-direction: column; gap: 6px; }
  .stat-card .label { font-size: 12px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.05em; }
  .stat-card .big { font-size: 22px; font-weight: 700; }
  .stat-card .sub { font-size: 13px; color: var(--text-dim); }

  .empty-state {
    padding: 32px 20px;
    text-align: center;
    color: var(--text-faint);
    font-size: 14px;
    border: 1px dashed var(--border);
    border-radius: var(--radius);
  }

  .overview-highlight { padding: 18px; display: flex; flex-direction: column; gap: 5px; }
  .overview-highlight .kicker { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-faint); }
  .overview-highlight .name { font-size: 17px; font-weight: 700; }
  .overview-highlight .detail { font-size: 13px; color: var(--text-dim); line-height: 1.5; }

  /* ---------- Pager cards (Overview: Recommendations / Risk Changes) ---------- */
  .pager-card { padding: 18px; }
  .pager-body { display: flex; align-items: stretch; gap: 8px; }
  .pager-arrow {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 999px;
    width: 30px;
    height: 30px;
    min-width: 30px;
    cursor: pointer;
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    align-self: center;
  }
  .pager-arrow:hover { background: var(--accent-soft); color: var(--accent); }
  .pager-arrow:disabled { opacity: 0.35; cursor: default; background: var(--surface-2); color: var(--text-dim); }
  .pager-face {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    border-left: 3px solid var(--warn);
    border-radius: 4px var(--radius-sm) var(--radius-sm) 4px;
    background: var(--surface-2);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .pager-face.type-binary-catalyst { border-left-color: var(--accent); }
  .pager-face.type-add-consideration { border-left-color: var(--good); }
  .pager-face.type-risk-change { border-left-color: var(--bad); }
  .pager-face.type-trim, .pager-face.type-overbought, .pager-face.type-oversold { border-left-color: var(--warn); }
  .rec-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .rec-ticker-type { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .rec-ticker-type .t { font-weight: 700; font-size: 14.5px; }
  .rec-rationale { font-size: 13.5px; color: var(--text-dim); line-height: 1.5; }
  .rec-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .trigger-val { font-size: 12px; color: var(--text-faint); }
  .dismiss-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: var(--radius-sm);
    padding: 6px 12px;
    font-size: 12.5px;
    cursor: pointer;
    min-height: 30px;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .dismiss-btn:hover { background: var(--bad-soft); color: var(--bad); border-color: var(--bad-soft); }
  .pager-dots { display: flex; gap: 6px; justify-content: center; margin-top: 12px; }
  .pager-dots .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border); border: none; cursor: pointer; padding: 0; }
  .pager-dots .dot.active { background: var(--accent); }
  .pager-empty { font-size: 13.5px; color: var(--text-faint); padding: 8px 2px; }

  .tag {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 3px 9px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .tag.oversold { background: var(--good-soft); color: var(--good); }
  .tag.overbought { background: var(--bad-soft); color: var(--bad); }
  .tag.catalyst { background: var(--accent-soft); color: var(--accent); }
  .tag.insider { background: var(--warn-soft); color: var(--warn); }
  .tag.risk { background: var(--warn-soft); color: var(--warn); }
  .tag.trim, .tag.overbought-badge { background: var(--warn-soft); color: var(--warn); }

  /* ---------- Recommendation cards (full list, Watchlist & News tab) ---------- */
  .rec-card {
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 10px;
    border-left: 3px solid var(--warn);
    border-radius: 4px var(--radius) var(--radius) 4px;
  }
  .rec-card.type-binary-catalyst { border-left-color: var(--accent); }
  .rec-card.type-add-consideration { border-left-color: var(--good); }
  .rec-card.type-risk-change { border-left-color: var(--bad); }
  .rec-card.type-trim, .rec-card.type-overbought, .rec-card.type-oversold { border-left-color: var(--warn); }

  /* ---------- Positions toolbar / filter ---------- */
  .positions-toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .positions-toolbar .label { font-size: 12.5px; color: var(--text-faint); }
  .sort-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 13px;
    color: var(--text-dim);
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .sort-btn.active { color: var(--accent); border-color: var(--accent-soft); background: var(--accent-soft); font-weight: 600; }
  .filter-input {
    padding: 8px 14px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    width: 200px;
    max-width: 100%;
    margin-left: auto;
  }
  .filter-input::placeholder { color: var(--text-faint); }

  /* ---------- Sector group headers ---------- */
  .sector-group-header {
    position: sticky;
    top: var(--topbar-h);
    z-index: 10;
    background: var(--bg);
    padding: 10px 2px 8px;
    margin-top: 22px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  .sector-group-header:first-of-type { margin-top: 4px; }
  .sector-group-header .name { font-size: 13.5px; font-weight: 700; }
  .sector-group-header .meta { font-size: 12px; color: var(--text-faint); }

  /* ---------- Positions ---------- */
  .position-list { display: flex; flex-direction: column; gap: 10px; }
  .position-card { padding: 0; overflow: hidden; }
  .position-head {
    display: grid;
    grid-template-columns: 84px 1fr 1fr auto auto auto;
    align-items: center;
    gap: 14px;
    padding: 15px 18px;
    cursor: pointer;
    background: none;
    border: none;
    width: 100%;
    text-align: left;
    color: var(--text);
    min-height: 44px;

  .position-head:hover { background: var(--surface-2); }
  .pos-ticker { font-weight: 700; font-size: 15px; letter-spacing: 0.01em; }
  .pos-price-block { display: flex; flex-direction: column; gap: 2px; }
  .pos-price-block .cur { font-size: 14px; font-weight: 600; }
  .pos-price-block .cost { font-size: 12px; color: var(--text-faint); }
  .pos-target-block { display: flex; flex-direction: column; gap: 2px; }
  .pos-target-block .lbl { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); }
  .pos-target-block .val { font-size: 13px; color: var(--text-dim); }
  .pos-mv-block { display: flex; flex-direction: column; gap: 2px; text-align: right; }
  .pos-mv-block .mv { font-size: 14px; font-weight: 600; }
  .pos-mv-block .sub-metric { font-size: 12px; font-weight: 600; }

    font-size: 13px;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: var(--radius-sm);
    white-space: nowrap;
    min-width: 66px;
    text-align: center;

  .pos-chip.good { background: var(--good-soft); color: var(--good); }
  .pos-chip.bad { background: var(--bad-soft); color: var(--bad); }
  .pos-chip.neutral { background: var(--surface-2); color: var(--text-dim); }
  .chevron { color: var(--text-faint); transition: transform 0.15s ease; font-size: 12px; }
  .position-card.open .chevron { transform: rotate(90deg); }

  .position-detail {
    display: none;
    padding: 4px 18px 18px;
    border-top: 1px solid var(--border);

  .position-card.open .position-detail { display: block; }
  .detail-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
    margin: 14px 0;
  }
  .detail-item { background: var(--surface-2); border-radius: var(--radius-sm); padding: 11px 13px; }
  .detail-item .lbl { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); margin-bottom: 3px; }
  .detail-item .val { font-size: 14px; font-weight: 600; }
  .detail-flag { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-left: 6px; }
  .detail-flag.warn { background: var(--warn-soft); color: var(--warn); }
  .detail-flags-row { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0; }
  .insider-note { font-size: 12.5px; color: var(--text-dim); background: var(--surface-2); border-radius: var(--radius-sm); padding: 10px 12px; margin: 10px 0; line-height: 1.5; }
  .insider-note .lbl { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); margin-bottom: 4px; }
  .news-list { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
  .news-list li { font-size: 13px; color: var(--text-dim); line-height: 1.5; }
  .news-list .arrow-good { color: var(--good); margin-right: 5px; }
  .news-list .arrow-bad { color: var(--bad); margin-right: 5px; }
  .no-news { font-size: 13px; color: var(--text-faint); font-style: italic; }

  /* ---------- Watchlist / news feed ---------- */
  .feed-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 11px 4px;
    border-bottom: 1px solid var(--border);
    font-size: 13.5px;
  }
  .feed-row:last-child { border-bottom: none; }
  .feed-row .feed-ticker { font-weight: 700; font-size: 13px; min-width: 46px; }
  .feed-row .feed-flags { display: flex; gap: 4px; flex-wrap: wrap; }
  .feed-row .feed-text { flex: 1; min-width: 200px; color: var(--text-dim); line-height: 1.5; }
  .feed-row .feed-text.arrow-good::before { content: "\25B2 "; color: var(--good); }
  .feed-row .feed-text.arrow-bad::before { content: "\25BC "; color: var(--bad); }
  .feed-row .feed-date { font-size: 11px; color: var(--text-faint); white-space: nowrap; }

  footer.notes {
    margin-top: 34px;
    padding: 16px 18px;
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    font-size: 12.5px;
    color: var(--text-faint);
  }
  footer.notes ul { margin: 8px 0 0; padding-left: 18px; }
  footer.notes li { margin-bottom: 5px; }

  @media (max-width: 620px) {
    main { padding: 16px; }
    .topbar-inner { padding: 14px 16px; gap: 20px 28px; }
    .tabs { padding: 10px 16px 8px; }
    .position-head { grid-template-columns: 60px 1fr auto; padding: 14px 16px; gap: 10px; }
    .pos-target-block { display: none; }
    .pos-mv-block { grid-column: 3; }
    .sort-btn { padding: 8px 14px; }
    .filter-input { width: 100%; margin-left: 0; }
    .dismiss-btn { padding: 8px 14px; min-height: 36px; }
    .feed-row { flex-wrap: wrap; }
  }
</style>

<script>
(function () {
  "use strict";

  function parseJSONBlock(id) {
    var el = document.getElementById(id);
    if (!el) return null;
    var txt = (el.textContent || "").trim();
    if (!txt) return null;
    try { return JSON.parse(txt); } catch (e) { return null; }
  }

  var daily = parseJSONBlock("daily-data-json") || {};
  var weekly = parseJSONBlock("weekly-cache-json") || {};
  var positions = daily.positions || [];
  var totals = daily.totals || {};
  var recommendations = daily.recommendations || [];
  var notes = daily.notes || [];
  var weeklyPositions = (weekly && weekly.positions) || {};

  // ---------- Derived per-position fields ----------
  positions.forEach(function (p) {
    p.avg_cost_per_share = (p.shares ? p.cost_basis / p.shares : null);
    p.unrealized_pl_pct = (p.cost_basis ? (p.unrealized_pl / p.cost_basis) * 100 : null);
    p.portfolio_weight_pct = (totals.portfolio_value ? (p.market_value / totals.portfolio_value) * 100 : null);
  });
  var positionsByTicker = {};
  positions.forEach(function (p) { positionsByTicker[p.ticker] = p; });

  function daysUntil(dateStr) {
    if (!dateStr) return null;
    var target = new Date(dateStr + "T00:00:00Z").getTime();
    var now = new Date((daily.date || dateStr) + "T00:00:00Z").getTime();
    if (isNaN(target) || isNaN(now)) return null;
    return Math.round((target - now) / 86400000);
  }

  var DISMISS_KEY = "portfolio_dismissals_v1";
  var DISMISS_WINDOW_DAYS = 14;

  function loadDismissals() {
    try {
      var raw = localStorage.getItem(DISMISS_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }
  function saveDismissals(list) {
    try { localStorage.setItem(DISMISS_KEY, JSON.stringify(list)); } catch (e) {}
  }

  function isMateriallyWorse(prevTrigger, curTrigger, recType) {
    if (typeof prevTrigger !== "number" || typeof curTrigger !== "number") return false;
    if (recType === "oversold" || recType === "overbought") {
      return Math.abs(curTrigger - prevTrigger) >= 10;
    }
    if (recType === "trim") {
      return curTrigger - prevTrigger >= 2;
    }
    return Math.abs(curTrigger - prevTrigger) >= 2;
  }

  function shouldShowRec(rec) {
    var dismissals = loadDismissals();
    var match = null;
    for (var i = 0; i < dismissals.length; i++) {
      if (dismissals[i].ticker === rec.ticker && dismissals[i].rec_type === rec.rec_type) { match = dismissals[i]; break; }
    }
    if (!match) return true;
    var dismissedAt = new Date(match.date).getTime();
    var now = new Date(daily.date || match.date).getTime();
    var ageDays = (now - dismissedAt) / 86400000;
    if (isNaN(ageDays) || ageDays > DISMISS_WINDOW_DAYS) return true;
    return isMateriallyWorse(match.trigger_value, rec.trigger_value, rec.rec_type);
  }

  function dismissRec(rec, onRemoved) {
    var dismissals = loadDismissals().filter(function (d) {
      return !(d.ticker === rec.ticker && d.rec_type === rec.rec_type);
    });
    dismissals.push({ ticker: rec.ticker, rec_type: rec.rec_type, trigger_value: rec.trigger_value, date: daily.date || new Date().toISOString().slice(0, 10) });
    saveDismissals(dismissals);
    onRemoved();
  }

  function fmtUSD(n, opts) {
    if (typeof n !== "number" || isNaN(n)) return "—";
    opts = opts || {};
    var sign = n > 0 ? "+" : n < 0 ? "−" : "";
    var abs = Math.abs(n);
    var digits = opts.precise ? { minimumFractionDigits: 2, maximumFractionDigits: 4 } : { minimumFractionDigits: 2, maximumFractionDigits: 2 };
    var s = abs.toLocaleString("en-US", digits);
    return (opts.noSign ? "" : sign) + "$" + s;
  }
  function fmtPct(n) {
    if (typeof n !== "number" || isNaN(n)) return "—";
    var sign = n > 0 ? "+" : n < 0 ? "−" : "";
    return sign + Math.abs(n).toFixed(2) + "%";
  }
  function signClass(n) {
    if (typeof n !== "number" || isNaN(n)) return "neutral";
    return n > 0 ? "good" : n < 0 ? "bad" : "neutral";
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // ---------- Top bar ----------
  document.getElementById("bar-value").textContent = fmtUSD(totals.portfolio_value, { noSign: true });
  var todayEl = document.getElementById("bar-today");
  todayEl.textContent = fmtUSD(totals.today_dollars) + "  (" + fmtPct(totals.today_pct) + ")";
  todayEl.className = "value num " + signClass(totals.today_dollars);
  var plEl = document.getElementById("bar-pl");
  plEl.textContent = fmtUSD(totals.unrealized_pl) + (typeof totals.unrealized_pl_pct === "number" ? "  (" + fmtPct(totals.unrealized_pl_pct) + ")" : "");
  plEl.className = "value num " + signClass(totals.unrealized_pl);
  var moverEl = document.getElementById("bar-mover");
  if (totals.biggest_mover && totals.biggest_mover.ticker) {
    moverEl.textContent = totals.biggest_mover.ticker + "  " + fmtPct(totals.biggest_mover.today_pct);
    moverEl.className = "value num " + signClass(totals.biggest_mover.today_pct);
  } else {
    moverEl.textContent = "—";
  }
  document.getElementById("bar-date").textContent = daily.date ? "As of " + daily.date : "";

  // ---------- Tabs ----------
  var tabBtns = document.querySelectorAll(".tab-btn");
  var panels = { overview: document.getElementById("tab-overview"), positions: document.getElementById("tab-positions"), watchlist: document.getElementById("tab-watchlist") };
  tabBtns.forEach(function (btn) {
    btn.addEventListener("click", function () {
      tabBtns.forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      Object.keys(panels).forEach(function (k) { panels[k].classList.remove("active"); });
      panels[btn.dataset.tab].classList.add("active");
    });
  });

  // ---------- Sticky offset for sector group headers ----------
  function updateTopbarHeight() {
    var tb = document.querySelector(".topbar");
    if (tb) document.documentElement.style.setProperty("--topbar-h", tb.offsetHeight + "px");
  }
  updateTopbarHeight();
  window.addEventListener("resize", updateTopbarHeight);

  var REC_LABELS = {
    trim: "Trim", "add-consideration": "Add consideration", overbought: "Overbought",
    oversold: "Oversold", "binary-catalyst": "Binary catalyst", "risk-change": "Risk change"
  };

  function triggerLabel(rec) {
    if (typeof rec.trigger_value !== "number") return "";
    if (rec.rec_type === "trim") return "Position: " + rec.trigger_value.toFixed(1) + "% of portfolio";
    if (rec.rec_type === "oversold" || rec.rec_type === "overbought") return "RSI " + rec.trigger_value.toFixed(1);
    if (rec.rec_type === "binary-catalyst") return rec.trigger_value + " day(s) to catalyst";
    if (rec.rec_type === "add-consideration") return rec.trigger_value.toFixed(1) + "% upside to target";
    if (rec.rec_type === "risk-change") return "Risk score: " + rec.trigger_value;
    return "Trigger: " + rec.trigger_value;
  }

  function recFaceHTML(rec) {
    return (
      '<div class="rec-top">' +
        '<div class="rec-ticker-type"><span class="t">' + esc(rec.ticker) + '</span>' +
        '<span class="tag">' + esc(REC_LABELS[rec.rec_type] || rec.rec_type) + "</span></div>" +
      "</div>" +
      '<div class="rec-rationale">' + esc(rec.rationale) + "</div>" +
      '<div class="rec-foot"><span class="trigger-val num">' + esc(triggerLabel(rec)) + "</span></div>"
    );
  }

  // ---------- Generic pager builder (Overview: Recommendations / Risk Changes) ----------
  function buildPager(container, recsAll, emptyText) {
    var state = { items: recsAll.filter(shouldShowRec), idx: 0 };

    function render() {
      container.innerHTML = "";
      if (!state.items.length) {
        var empty = document.createElement("div");
        empty.className = "pager-empty";
        empty.textContent = emptyText;
        container.appendChild(empty);
        return;
      }
      if (state.idx >= state.items.length) state.idx = state.items.length - 1;
      var rec = state.items[state.idx];

      var body = document.createElement("div");
      body.className = "pager-body";

      var prevBtn = document.createElement("button");
      prevBtn.type = "button";
      prevBtn.className = "pager-arrow";
      prevBtn.textContent = "‹";
      prevBtn.disabled = state.items.length < 2;
      prevBtn.addEventListener("click", function () { state.idx = (state.idx - 1 + state.items.length) % state.items.length; render(); });

      var face = document.createElement("div");
      face.className = "pager-face type-" + rec.rec_type;
      face.innerHTML = recFaceHTML(rec);
      var foot = face.querySelector(".rec-foot");
      var dismissBtn = document.createElement("button");
      dismissBtn.type = "button";
      dismissBtn.className = "dismiss-btn";
      dismissBtn.textContent = "Dismiss";
      dismissBtn.addEventListener("click", function () {
        dismissRec(rec, function () {
          state.items = state.items.filter(function (r) { return !(r.ticker === rec.ticker && r.rec_type === rec.rec_type); });
          render();
        });
      });
      foot.appendChild(dismissBtn);

      var nextBtn = document.createElement("button");
      nextBtn.type = "button";
      nextBtn.className = "pager-arrow";
      nextBtn.textContent = "›";
      nextBtn.disabled = state.items.length < 2;
      nextBtn.addEventListener("click", function () { state.idx = (state.idx + 1) % state.items.length; render(); });

      body.appendChild(prevBtn);
      body.appendChild(face);
      body.appendChild(nextBtn);
      container.appendChild(body);

      if (state.items.length > 1) {
        var dots = document.createElement("div");
        dots.className = "pager-dots";
        state.items.forEach(function (r, i) {
          var d = document.createElement("button");
          d.type = "button";
          d.className = "dot" + (i === state.idx ? " active" : "");
          d.addEventListener("click", function () { state.idx = i; render(); });
          dots.appendChild(d);
        });
        container.appendChild(dots);
      }
    }
    render();
  }

  // ---------- Overview tab ----------
  (function buildOverview() {
    var el = panels.overview;
    var frag = document.createDocumentFragment();

    var sorted = positions.slice().sort(function (a, b) { return (a.today_pct || 0) - (b.today_pct || 0); });
    var loser = sorted[0], gainer = sorted[sorted.length - 1];

    var t1 = document.createElement("div");
    t1.className = "section-title";
    t1.textContent = "Snapshot";
    frag.appendChild(t1);

    var grid = document.createElement("div");
    grid.className = "grid-4";
    function hi(kicker, name, detail, cls) {
      var c = document.createElement("div");
      c.className = "card overview-highlight";
      c.innerHTML = '<span class="kicker">' + esc(kicker) + '</span><span class="name ' + (cls || "") + '">' + esc(name) + '</span><span class="detail">' + esc(detail) + "</span>";
      return c;
    }
    if (gainer) grid.appendChild(hi("Biggest gainer", gainer.ticker, fmtPct(gainer.today_pct) + " today · " + fmtUSD(gainer.market_value, { noSign: true }) + " value", signClass(gainer.today_pct)));
    if (loser) grid.appendChild(hi("Biggest loser", loser.ticker, fmtPct(loser.today_pct) + " today · " + fmtUSD(loser.market_value, { noSign: true }) + " value", signClass(loser.today_pct)));

    var recCard = document.createElement("div");
    recCard.className = "card pager-card";
    recCard.innerHTML = '<div class="section-title" style="margin:0 0 10px;">Recommendations</div><div class="pager-slot"></div>';
    grid.appendChild(recCard);

    var riskCard = document.createElement("div");
    riskCard.className = "card pager-card";
    riskCard.innerHTML = '<div class="section-title" style="margin:0 0 10px;">Risk changes</div><div class="pager-slot"></div>';
    grid.appendChild(riskCard);

    frag.appendChild(grid);
    el.appendChild(frag);

    var nonRisk = recommendations.filter(function (r) { return r.rec_type !== "risk-change"; }).slice(0, 3);
    var riskOnly = recommendations.filter(function (r) { return r.rec_type === "risk-change"; }).slice(0, 3);
    buildPager(recCard.querySelector(".pager-slot"), nonRisk, recommendations.length ? "All recommendations dismissed within the last 14 days." : "No recommendations today.");
    buildPager(riskCard.querySelector(".pager-slot"), riskOnly, "No risk changes today.");
  })();

  // ---------- Positions tab ----------
  (function buildPositions() {
    var el = panels.positions;
    var openTickers = {};
    var sortState = {
      value: { key: "value", label: "Value", dir: 1 },
      gain: { key: "gain", label: "% Gain/Loss", dir: 1 },
      sector: { key: "sector", label: "Sector", dir: 1 }
    };
    var activeSortKey = "value";
    var filterText = "";

    var toolbar = document.createElement("div");
    toolbar.className = "positions-toolbar";
    toolbar.innerHTML = '<span class="label">Sort by</span>';

    var listEl = document.createElement("div");
    listEl.className = "position-list";

    function filteredPositions() {
      if (!filterText) return positions.slice();
      var q = filterText.toUpperCase();
      return positions.filter(function (p) { return p.ticker.toUpperCase().indexOf(q) !== -1; });
    }

    function render() {
      var sortDef = sortState[activeSortKey];
      var list = filteredPositions();
      listEl.innerHTML = "";

      if (!list.length) {
        var empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = "No positions match this filter.";
        listEl.appendChild(empty);
        return;
      }

      if (sortDef.key === "value") {
        list.sort(function (a, b) { return sortDef.dir * ((b.market_value || 0) - (a.market_value || 0)); });
        list.forEach(function (p) { listEl.appendChild(renderPositionCard(p, "value")); });
      } else if (sortDef.key === "gain") {
        list.sort(function (a, b) { return sortDef.dir * ((b.unrealized_pl_pct || 0) - (a.unrealized_pl_pct || 0)); });
        list.forEach(function (p) { listEl.appendChild(renderPositionCard(p, "gain")); });
      } else {
        var groups = {};
        list.forEach(function (p) {
          var key = p.sector || "Other";
          if (!groups[key]) groups[key] = [];
          groups[key].push(p);
        });
        var groupArr = Object.keys(groups).map(function (name) {
          var items = groups[name];
          var value = items.reduce(function (s, p) { return s + (p.market_value || 0); }, 0);
          return { name: name, items: items, value: value };
        });
        groupArr.sort(function (a, b) { return b.value - a.value; });
        groupArr.forEach(function (g) {
          g.items.sort(function (a, b) { return (b.market_value || 0) - (a.market_value || 0); });
          var header = document.createElement("div");
          header.className = "sector-group-header";
          var pctOfTotal = totals.portfolio_value ? (g.value / totals.portfolio_value) * 100 : 0;
          header.innerHTML = '<span class="name">' + esc(g.name) + '</span><span class="meta">' + fmtUSD(g.value, { noSign: true }) + " · " + pctOfTotal.toFixed(1) + "% of portfolio</span>";
          listEl.appendChild(header);
          g.items.forEach(function (p) { listEl.appendChild(renderPositionCard(p, "value")); });
        });
      }
    }

    Object.keys(sortState).forEach(function (key) {
      var s = sortState[key];
      var b = document.createElement("button");
      b.className = "sort-btn" + (key === activeSortKey ? " active" : "");
      b.textContent = s.label;
      b.type = "button";
      b.addEventListener("click", function () {
        if (activeSortKey === key && key !== "sector") {
          s.dir = -s.dir;
        }
        activeSortKey = key;
        toolbar.querySelectorAll(".sort-btn").forEach(function (x) { x.classList.remove("active"); });
        b.classList.add("active");
        render();
      });
      toolbar.appendChild(b);
    });

    var filterInput = document.createElement("input");
    filterInput.type = "text";
    filterInput.className = "filter-input";
    filterInput.placeholder = "Filter by ticker…";
    filterInput.addEventListener("input", function () {
      filterText = filterInput.value.trim();
      render();
    });
    toolbar.appendChild(filterInput);

    el.appendChild(toolbar);
    el.appendChild(listEl);

    function renderPositionCard(p, mode) {
      var card = document.createElement("div");
      card.className = "card position-card" + (openTickers[p.ticker] ? " open" : "");
      var rsiFlag = "";
      if (typeof p.rsi === "number") {
        if (p.rsi < 30) rsiFlag = '<span class="detail-flag warn">Oversold</span>';
        else if (p.rsi > 70) rsiFlag = '<span class="detail-flag warn">Overbought</span>';
      }
      var head = document.createElement("button");
      head.type = "button";
      head.className = "position-head";

      var rightTop, rightBottom, rightBottomCls;
      if (mode === "gain") {
        rightTop = fmtUSD(p.market_value, { noSign: true });
        rightBottom = fmtPct(p.unrealized_pl_pct) + " since buy";
        rightBottomCls = signClass(p.unrealized_pl_pct);
      } else {
        rightTop = fmtUSD(p.market_value, { noSign: true });
        rightBottom = fmtPct(p.today_pct) + " today";
        rightBottomCls = signClass(p.today_pct);
      }

      head.innerHTML =
        '<span class="pos-ticker">' + esc(p.ticker) + '</span>' +
        '<span class="pos-price-block"><span class="cur num">' + fmtUSD(p.current_price, { noSign: true, precise: true }) + '</span><span class="cost num">cost ' + fmtUSD(p.avg_cost_per_share, { noSign: true, precise: true }) + '</span></span>' +
        '<span class="pos-target-block"><span class="lbl">12mo target</span><span class="val num">' + (typeof p.analyst_target === "number" ? fmtUSD(p.analyst_target, { noSign: true, precise: true }) : esc(p.analyst_target || "no consensus available")) + '</span></span>' +
        '<span class="pos-mv-block"><span class="mv num">' + rightTop + '</span><span class="sub-metric num ' + rightBottomCls + '">' + esc(rightBottom) + '</span></span>' +
        '<span class="chevron">▸</span>';
      head.addEventListener("click", function () {
        card.classList.toggle("open");
        openTickers[p.ticker] = card.classList.contains("open");
      });
      card.appendChild(head);

      var detail = document.createElement("div");
      detail.className = "position-detail";
      var newsHtml = (p.news && p.news.length)
        ? '<ul class="news-list">' + p.news.map(function (n) { return newsItemLi(n); }).join("") + "</ul>"
        : '<div class="no-news">No recent news captured for this position.</div>';

      var flagsRow = [];
      if (typeof p.rsi === "number" && p.rsi < 30) flagsRow.push('<span class="tag oversold">Oversold RSI ' + p.rsi.toFixed(1) + '</span>');
      if (typeof p.rsi === "number" && p.rsi > 70) flagsRow.push('<span class="tag overbought">Overbought RSI ' + p.rsi.toFixed(1) + '</span>');
      var d2c = daysUntil(p.next_earnings);
      if (typeof d2c === "number" && d2c >= 0 && d2c <= 30) flagsRow.push('<span class="tag catalyst">Earnings in ' + d2c + 'd (' + esc(p.next_earnings) + ')</span>');
      var rec = recommendations.filter(function (r) { return r.ticker === p.ticker && r.rec_type === "risk-change"; })[0];
      if (rec) flagsRow.push('<span class="tag risk">Risk change</span>');
      var wc = weeklyPositions[p.ticker];
      if (wc && wc.insider_notes) flagsRow.push('<span class="tag insider">Insider activity</span>');

      detail.innerHTML =
        '<div class="detail-flags-row">' + flagsRow.join("") + '</div>' +
        '<div class="detail-grid">' +
          '<div class="detail-item"><div class="lbl">Support</div><div class="val num">' + (typeof p.support === "number" ? fmtUSD(p.support, { noSign: true, precise: true }) : "—") + '</div></div>' +
          '<div class="detail-item"><div class="lbl">Resistance</div><div class="val num">' + (typeof p.resistance === "number" ? fmtUSD(p.resistance, { noSign: true, precise: true }) : "—") + '</div></div>' +
          '<div class="detail-item"><div class="lbl">RSI</div><div class="val num">' + (typeof p.rsi === "number" ? p.rsi.toFixed(1) : "—") + rsiFlag + '</div></div>' +
          '<div class="detail-item"><div class="lbl">Next earnings</div><div class="val">' + esc(p.next_earnings || "—") + '</div></div>' +
          '<div class="detail-item"><div class="lbl">Unrealized P/L</div><div class="val num ' + signClass(p.unrealized_pl) + '">' + fmtUSD(p.unrealized_pl) + (typeof p.unrealized_pl_pct === "number" ? " (" + fmtPct(p.unrealized_pl_pct) + ")" : "") + '</div></div>' +
          '<div class="detail-item"><div class="lbl">Portfolio weight</div><div class="val num">' + (typeof p.portfolio_weight_pct === "number" ? p.portfolio_weight_pct.toFixed(1) + "%" : "—") + '</div></div>' +
        "</div>" +
        (wc && wc.insider_notes ? '<div class="insider-note"><span class="lbl">Insider signals — best-effort search, not verified SEC filings</span>' + esc(wc.insider_notes) + '</div>' : "") +
        newsHtml;
      card.appendChild(detail);
      return card;
    }

    render();
  })();

  function newsItemLi(n) {
    var sentiment = n && n.sentiment;
    var cls = sentiment === "good" ? "arrow-good" : sentiment === "bad" ? "arrow-bad" : "";
    var text = n && typeof n === "object" ? n.text : n;
    return '<li><span class="' + cls + '">' + esc(text) + "</span></li>";
  }

  // ---------- Watchlist & News tab ----------
  (function buildWatchlist() {
    var el = panels.watchlist;

    var header = document.createElement("div");
    header.className = "positions-toolbar";
    header.innerHTML = '<span class="label">Filter</span>';
    var filterInput = document.createElement("input");
    filterInput.type = "text";
    filterInput.className = "filter-input";
    filterInput.placeholder = "Filter by ticker…";
    header.appendChild(filterInput);
    el.appendChild(header);

    var recTitle = document.createElement("div");
    recTitle.className = "section-title";
    recTitle.textContent = "All recommendations";
    el.appendChild(recTitle);
    var recListEl = document.createElement("div");
    el.appendChild(recListEl);

    var feedTitle = document.createElement("div");
    feedTitle.className = "section-title";
    feedTitle.textContent = "News feed, newest first";
    el.appendChild(feedTitle);
    var feedListEl = document.createElement("div");
    feedListEl.className = "card";
    feedListEl.style.padding = "4px 14px";
    el.appendChild(feedListEl);

    function tickerFlags(ticker) {
      var p = positionsByTicker[ticker];
      var flags = [];
      if (!p) return flags;
      if (typeof p.rsi === "number" && p.rsi < 30) flags.push('<span class="tag oversold">Oversold</span>');
      if (typeof p.rsi === "number" && p.rsi > 70) flags.push('<span class="tag overbought">Overbought</span>');
      var d2c = daysUntil(p.next_earnings);
      if (typeof d2c === "number" && d2c >= 0 && d2c <= 30) flags.push('<span class="tag catalyst">Catalyst ' + d2c + 'd</span>');
      var wc = weeklyPositions[ticker];
      if (wc && wc.insider_notes) flags.push('<span class="tag insider">Insider</span>');
      var risk = recommendations.filter(function (r) { return r.ticker === ticker && r.rec_type === "risk-change"; })[0];
      if (risk) flags.push('<span class="tag risk">Risk change</span>');
      return flags;
    }

    function renderRecList(filterQ) {
      recListEl.innerHTML = "";
      var visible = recommendations.filter(shouldShowRec).filter(function (r) {
        return !filterQ || r.ticker.toUpperCase().indexOf(filterQ) !== -1;
      });
      if (!visible.length) {
        var empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = recommendations.length ? "No matching recommendations (or all dismissed within 14 days)." : "No recommendations today.";
        recListEl.appendChild(empty);
        return;
      }
      visible.forEach(function (rec) {
        var div = document.createElement("div");
        div.className = "card rec-card type-" + rec.rec_type;
        div.innerHTML =
          recFaceHTML(rec).replace('<div class="rec-foot">', '<div class="rec-foot">');
        var foot = div.querySelector(".rec-foot");
        var dismissBtn = document.createElement("button");
        dismissBtn.type = "button";
        dismissBtn.className = "dismiss-btn";
        dismissBtn.textContent = "Dismiss";
        dismissBtn.addEventListener("click", function () {
          dismissRec(rec, function () { div.remove(); });
        });
        foot.appendChild(dismissBtn);
        recListEl.appendChild(div);
      });
    }

    function renderFeed(filterQ) {
      feedListEl.innerHTML = "";
      var flat = [];
      positions.forEach(function (p) {
        (p.news || []).forEach(function (n) {
          flat.push({ ticker: p.ticker, text: n.text, sentiment: n.sentiment, source_date: n.source_date || daily.date });
        });
      });
      flat = flat.filter(function (item) { return !filterQ || item.ticker.toUpperCase().indexOf(filterQ) !== -1; });
      flat.sort(function (a, b) {
        var da = new Date(a.source_date).getTime(), db = new Date(b.source_date).getTime();
        if (isNaN(da) || isNaN(db) || da === db) return a.ticker.localeCompare(b.ticker);
        return db - da;
      });
      if (!flat.length) {
        var empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = "No news items match this filter.";
        feedListEl.appendChild(empty);
        return;
      }
      flat.forEach(function (item) {
        var row = document.createElement("div");
        row.className = "feed-row";
        var cls = item.sentiment === "good" ? "arrow-good" : item.sentiment === "bad" ? "arrow-bad" : "";
        if (!item.sentiment) {
          notes.indexOf && null;
        }
        row.innerHTML =
          '<span class="feed-ticker">' + esc(item.ticker) + '</span>' +
          '<span class="feed-flags">' + tickerFlags(item.ticker).join("") + '</span>' +
          '<span class="feed-text ' + cls + '">' + esc(item.text) + '</span>' +
          '<span class="feed-date">' + esc(item.source_date || "") + '</span>';
        feedListEl.appendChild(row);
      });
    }

    filterInput.addEventListener("input", function () {
      var q = filterInput.value.trim().toUpperCase();
      renderRecList(q);
      renderFeed(q);
    });

    renderRecList("");
    renderFeed("");
  })();

  // ---------- Notes footer ----------
  if (notes && notes.length) {
    var footer = document.getElementById("notes-footer");
    footer.style.display = "block";
    footer.innerHTML = "<strong>Data notes</strong><ul>" + notes.map(function (n) { return "<li>" + esc(n) + "</li>"; }).join("") + "</ul>";
  }
})();
</script>
