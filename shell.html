<title>Portfolio Briefing</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<style>
  :root {
    --bg: #faf9f7;
    --surface: #ffffff;
    --surface-2: #f5f4f1;
    --border: #ececec;
    --text: #1a1a1a;
    --text-dim: #6b6b6b;
    --text-faint: #9a9a94;
    --accent: #4c6fa5;
    --accent-soft: #ebf1f8;
    --good: #2e7d5b;
    --good-soft: #e7f4ee;
    --bad: #c0392b;
    --bad-soft: #fbeae7;
    --warn: #a8752e;
    --warn-soft: #faf1de;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 1px 2px rgba(20, 20, 20, 0.04), 0 6px 16px rgba(20, 20, 20, 0.05);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1116;
      --surface: #161a21;
      --surface-2: #1d222b;
      --border: #2a303b;
      --text: #e7eaee;
      --text-dim: #9aa4b2;
      --text-faint: #6b7482;
      --accent: #7d9bd4;
      --accent-soft: #1c2740;
      --good: #4cd0a0;
      --good-soft: #123128;
      --bad: #f2697c;
      --bad-soft: #3a1620;
      --warn: #d9a860;
      --warn-soft: #362a12;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 18px rgba(0, 0, 0, 0.25);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1116; --surface: #161a21; --surface-2: #1d222b; --border: #2a303b;
    --text: #e7eaee; --text-dim: #9aa4b2; --text-faint: #6b7482;
    --accent: #7d9bd4; --accent-soft: #1c2740;
    --good: #4cd0a0; --good-soft: #123128; --bad: #f2697c; --bad-soft: #3a1620;
    --warn: #d9a860; --warn-soft: #362a12;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 18px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #faf9f7; --surface: #ffffff; --surface-2: #f5f4f1; --border: #ececec;
    --text: #1a1a1a; --text-dim: #6b6b6b; --text-faint: #9a9a94;
    --accent: #4c6fa5; --accent-soft: #ebf1f8;
    --good: #2e7d5b; --good-soft: #e7f4ee; --bad: #c0392b; --bad-soft: #fbeae7;
    --warn: #a8752e; --warn-soft: #faf1de;
    --shadow: 0 1px 2px rgba(20, 20, 20, 0.04), 0 6px 16px rgba(20, 20, 20, 0.05);
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); overflow-x: hidden; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, ui-sans-serif, system-ui, sans-serif;
    font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased;
  }
  .num, .mono, td.num, .price, .pct, .dollar { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
  h1, h2, h3 { text-wrap: balance; margin: 0; }
  a { color: var(--accent); }
  button { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  /* ---------- Sticky top bar ---------- */
  .topbar { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--border); box-shadow: 0 2px 10px rgba(20, 20, 20, 0.04); }
  .topbar-inner { max-width: 1120px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; gap: 24px 30px; flex-wrap: wrap; }
  .topbar-brand { font-weight: 700; font-size: 15px; letter-spacing: 0.01em; color: var(--text); white-space: nowrap; margin-right: 2px; }
  .topbar-metric { display: flex; flex-direction: column; gap: 3px; }
  .topbar-metric .label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-faint); white-space: nowrap; }
  .topbar-metric .value { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; }
  .topbar-metric .value.small { font-size: 14px; }
  .topbar-date { margin-left: auto; font-size: 12px; color: var(--text-faint); white-space: nowrap; }

  .good { color: var(--good); }
  .bad { color: var(--bad); }
  .neutral { color: var(--text-dim); }

  /* ---------- Tabs ---------- */
  .tabs { max-width: 1120px; margin: 0 auto; display: flex; gap: 4px; padding: 12px 24px 10px; }
  .tab-btn {
    background: transparent; border: none; color: var(--text-dim); font-size: 14px; font-weight: 600;
    padding: 9px 16px; cursor: pointer; border-radius: var(--radius-sm); transition: background 0.15s ease, color 0.15s ease;
  }
  .tab-btn:hover { background: var(--surface-2); color: var(--text); }
  .tab-btn.active { color: var(--accent); background: var(--accent-soft); }

  main { max-width: 1120px; margin: 0 auto; padding: 24px; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .section-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-faint); margin: 30px 0 14px; }
  .section-title:first-child { margin-top: 0; }

  /* ---------- Cards ---------- */
  .card { background: var(--surface); border: none; border-radius: var(--radius); box-shadow: var(--shadow); }
  .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  .stat-card { padding: 18px; display: flex; flex-direction: column; gap: 6px; }
  .stat-card .label { font-size: 12px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.05em; }
  .stat-card .big { font-size: 22px; font-weight: 700; }
  .stat-card .sub { font-size: 13px; color: var(--text-dim); }

  .empty-state { padding: 32px 20px; text-align: center; color: var(--text-faint); font-size: 14px; border: 1px dashed var(--border); border-radius: var(--radius); }

  /* ---------- Equity curve ---------- */
  .chart-card { padding: 18px; }
  .chart-card .chart-legend { display: flex; gap: 18px; font-size: 12.5px; color: var(--text-dim); margin-bottom: 10px; flex-wrap: wrap; }
  .chart-legend .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .chart-card svg { width: 100%; height: auto; display: block; }
  .chart-card .chart-caption { font-size: 11.5px; color: var(--text-faint); margin-top: 8px; }

  /* ---------- Theme exposure ---------- */
  .theme-row { display: flex; align-items: center; gap: 12px; padding: 9px 0; }
  .theme-row .theme-name { width: 150px; flex: 0 0 150px; font-size: 13px; font-weight: 600; }
  .theme-row .theme-bar-track { flex: 1; height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
  .theme-row .theme-bar-fill { height: 100%; background: var(--accent); border-radius: 999px; }
  .theme-row.over-40 .theme-bar-fill { background: var(--bad); }
  .theme-row .theme-pct { width: 56px; flex: 0 0 56px; text-align: right; font-size: 13px; font-weight: 600; }
  .theme-row .theme-move { width: 64px; flex: 0 0 64px; text-align: right; font-size: 12px; }

  /* ---------- Cash / totals strip ---------- */
  .totals-strip { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 6px; }
  .totals-strip .pill { background: var(--surface-2); border-radius: 999px; padding: 7px 14px; font-size: 12.5px; color: var(--text-dim); }
  .totals-strip .pill b { color: var(--text); font-weight: 700; }

  /* ---------- Closed positions ---------- */
  .closed-card { padding: 14px 18px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
  .closed-card .t { font-weight: 700; }
  .closed-card .meta { font-size: 12.5px; color: var(--text-faint); }

  /* ---------- Positions ---------- */
  .positions-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .positions-toolbar .label { font-size: 12.5px; color: var(--text-faint); }
  .sort-btn {
    background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 7px 14px;
    font-size: 13px; color: var(--text-dim); cursor: pointer; transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .sort-btn.active { color: var(--accent); border-color: var(--accent-soft); background: var(--accent-soft); font-weight: 600; }

  .position-list { display: flex; flex-direction: column; gap: 10px; }
  .position-card { padding: 0; overflow: hidden; }
  .position-head {
    display: grid; grid-template-columns: 84px 1fr 1fr 1fr auto auto auto; align-items: center; gap: 14px;
    padding: 15px 18px; cursor: pointer; background: none; border: none; width: 100%; text-align: left; color: var(--text); min-height: 44px;
  }
  .position-head:hover { background: var(--surface-2); }
  .pos-ticker { font-weight: 700; font-size: 15px; letter-spacing: 0.01em; display: flex; flex-direction: column; gap: 2px; }
  .pos-ticker .theme-tag { font-size: 10px; font-weight: 600; color: var(--text-faint); text-transform: none; }
  .pos-price-block { display: flex; flex-direction: column; gap: 2px; }
  .pos-price-block .cur { font-size: 14px; font-weight: 600; }
  .pos-price-block .cost { font-size: 12px; color: var(--text-faint); }
  .pos-target-block { display: flex; flex-direction: column; gap: 2px; }
  .pos-target-block .lbl { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); }
  .pos-target-block .val { font-size: 13px; color: var(--text-dim); }
  .pos-mv-block { display: flex; flex-direction: column; gap: 2px; text-align: right; }
  .pos-mv-block .mv { font-size: 14px; font-weight: 600; }
  .pos-mv-block .shares { font-size: 12px; color: var(--text-faint); }
  .pos-chip { font-size: 13px; font-weight: 700; padding: 5px 10px; border-radius: var(--radius-sm); white-space: nowrap; min-width: 66px; text-align: center; }
  .pos-chip.good { background: var(--good-soft); color: var(--good); }
  .pos-chip.bad { background: var(--bad-soft); color: var(--bad); }
  .chevron { color: var(--text-faint); transition: transform 0.15s ease; font-size: 12px; }
  .position-card.open .chevron { transform: rotate(90deg); }

  .position-detail { display: none; padding: 4px 18px 18px; border-top: 1px solid var(--border); }
  .position-card.open .position-detail { display: block; }
  .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 14px 0; }
  .detail-item { background: var(--surface-2); border-radius: var(--radius-sm); padding: 11px 13px; }
  .detail-item .lbl { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); margin-bottom: 3px; }
  .detail-item .val { font-size: 14px; font-weight: 600; }
  .detail-item .val-sub { font-size: 11px; font-weight: 400; color: var(--text-faint); margin-top: 2px; }
  .detail-flag { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-left: 6px; }
  .detail-flag.warn { background: var(--warn-soft); color: var(--warn); }
  .detail-item.full { grid-column: 1 / -1; }
  .news-list { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
  .news-list li { font-size: 13px; color: var(--text-dim); padding-left: 14px; position: relative; line-height: 1.5; }
  .news-list li::before { content: "\25CF"; position: absolute; left: 0; top: 1px; font-size: 9px; color: var(--text-faint); }
  .news-list li.sentiment-good::before { color: var(--good); }
  .news-list li.sentiment-bad::before { color: var(--bad); }
  .news-list li.sentiment-neutral::before { color: var(--text-faint); }
  .news-headline { display: block; font-weight: 600; color: var(--text); }
  .news-list li.sentiment-good .news-headline { color: var(--good); }
  .news-list li.sentiment-bad .news-headline { color: var(--bad); }
  .news-list li.sentiment-neutral .news-headline { color: var(--text); }
  .news-why { display: block; font-size: 11.5px; font-weight: 400; color: var(--text-faint); margin-top: 2px; }
  .no-news { font-size: 13px; color: var(--text-faint); font-style: italic; }

  /* ---------- Watchlist / news feed ---------- */
  .feed-item { display: flex; gap: 16px; padding: 16px 18px; margin-bottom: 10px; }
  .feed-ticker-col { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 58px; }
  .feed-ticker-col .t { font-weight: 700; font-size: 14px; }
  .feed-body { flex: 1; min-width: 0; }
  .feed-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .tag { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; padding: 3px 9px; border-radius: 999px; }
  .tag.oversold { background: var(--good-soft); color: var(--good); }
  .tag.overbought { background: var(--bad-soft); color: var(--bad); }
  .tag.catalyst { background: var(--accent-soft); color: var(--accent); }
  .tag.insider { background: var(--warn-soft); color: var(--warn); }
  .tag.risk { background: var(--warn-soft); color: var(--warn); }
  .feed-body ul { margin: 0; padding-left: 16px; font-size: 13.5px; color: var(--text-dim); line-height: 1.55; }
  .feed-body li { margin-bottom: 4px; }
  .feed-meta { font-size: 11.5px; color: var(--text-faint); margin-top: 8px; }

  /* ---------- Recommendation / overview cards ---------- */
  .rec-card { padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; border-left: 3px solid var(--warn); border-radius: 4px var(--radius) var(--radius) 4px; }
  .rec-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .rec-ticker-type { display: flex; align-items: center; gap: 8px; }
  .rec-ticker-type .t { font-weight: 700; font-size: 14.5px; }
  .rec-sev { font-size: 10.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.05em; }
  .rec-rationale { font-size: 13.5px; color: var(--text-dim); line-height: 1.55; }
  .rec-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .trigger-val { font-size: 12px; color: var(--text-faint); }
  .dismiss-btn {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text-dim); border-radius: var(--radius-sm);
    padding: 7px 13px; font-size: 12.5px; cursor: pointer; min-height: 32px; transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .dismiss-btn:hover { background: var(--bad-soft); color: var(--bad); border-color: var(--bad-soft); }

  .overview-highlight { padding: 18px; display: flex; flex-direction: column; gap: 5px; }
  .overview-highlight .kicker { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-faint); }
  .overview-highlight .name { font-size: 17px; font-weight: 700; }
  .overview-highlight .detail { font-size: 13px; color: var(--text-dim); line-height: 1.5; }

  footer.notes { margin-top: 34px; padding: 16px 18px; border: 1px dashed var(--border); border-radius: var(--radius); font-size: 12.5px; color: var(--text-faint); }
  footer.notes ul { margin: 8px 0 0; padding-left: 18px; }
  footer.notes li { margin-bottom: 5px; }

  @media (max-width: 620px) {
    main { padding: 16px; }
    .topbar-inner { padding: 14px 16px; gap: 16px 22px; }
    .tabs { padding: 10px 16px 8px; }
    .position-head { grid-template-columns: 60px 1fr auto; padding: 14px 16px; gap: 10px; }
    .pos-target-block, .pos-theme-block { display: none; }
    .pos-mv-block { grid-column: 3; }
    .sort-btn { padding: 8px 14px; }
    .dismiss-btn { padding: 8px 14px; min-height: 36px; }
    .feed-item { padding: 14px; gap: 12px; }
    .theme-row .theme-name { width: 100px; flex-basis: 100px; }
  }
</style>

      <span class="label">Total value</span>

    <div class="topbar-metric">

    <div class="topbar-metric">

<script>
(function () {
  "use strict";

  function parseJSONBlock(id) {
    var el = document.getElementById(id);
    if (!el) return null;
    var txt = (el.textContent || "").trim();
    if (!txt) return null;
    try { return JSON.parse(txt); } catch (e) { return null; }
  }

  var daily = parseJSONBlock("daily-data-json") || {};
  var weekly = parseJSONBlock("weekly-cache-json") || {};
  var history = parseJSONBlock("history-json") || {};
  var positions = daily.positions || [];
  var totals = daily.totals || {};
  var cash = daily.cash || {};
  var benchmark = daily.benchmark || {};
  var themes = daily.themes || {};
  var closedToday = daily.closed_today || [];
  var recommendations = (daily.recommendations || []).slice().sort(function (a, b) {
    return (a.severity == null ? 5 : a.severity) - (b.severity == null ? 5 : b.severity);
  });
  var notes = daily.notes || [];
  var historyRows = (history && history.rows) || [];

  var DISMISS_KEY = "portfolio_dismissals_v1";
  var DISMISS_WINDOW_DAYS = 14;

  function loadDismissals() {
    try {
      var raw = localStorage.getItem(DISMISS_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }
  function saveDismissals(list) {
    try { localStorage.setItem(DISMISS_KEY, JSON.stringify(list)); } catch (e) {}
  }
  function dismissKey(rec) { return rec.ticker + "::" + rec.rec_type; }

  function isMateriallyWorse(prevTrigger, curTrigger, recType) {
    if (typeof prevTrigger !== "number" || typeof curTrigger !== "number") return false;
    if (recType === "oversold" || recType === "overbought") {
      return Math.abs(curTrigger - prevTrigger) >= 10;
    }
    if (recType === "trim") {
      return curTrigger - prevTrigger >= 2;
    }
    if (recType === "risk-change") {
      return curTrigger - prevTrigger >= 2;
    }
    return Math.abs(curTrigger - prevTrigger) >= 2;
  }

  function shouldShowRec(rec) {
    var dismissals = loadDismissals();
    var match = null;
    for (var i = 0; i < dismissals.length; i++) {
      if (dismissals[i].ticker === rec.ticker && dismissals[i].rec_type === rec.rec_type) { match = dismissals[i]; break; }
    }
    if (!match) return true;
    var dismissedAt = new Date(match.date).getTime();
    var now = new Date(daily.date || match.date).getTime();
    var ageDays = (now - dismissedAt) / 86400000;
    if (isNaN(ageDays) || ageDays > DISMISS_WINDOW_DAYS) return true;
    return isMateriallyWorse(match.trigger_value, rec.trigger_value, rec.rec_type);
  }

  function dismissRec(rec, btnEl) {
    var dismissals = loadDismissals().filter(function (d) {
      return !(d.ticker === rec.ticker && d.rec_type === rec.rec_type);
    });
    dismissals.push({ ticker: rec.ticker, rec_type: rec.rec_type, trigger_value: rec.trigger_value, date: daily.date || new Date().toISOString().slice(0, 10) });
    saveDismissals(dismissals);
    var card = btnEl.closest(".rec-card");
    if (card) card.remove();
  }

  function fmtUSD(n, opts) {
    if (typeof n !== "number" || isNaN(n)) return "—";
    opts = opts || {};
    var sign = n > 0 ? "+" : n < 0 ? "−" : "";
    var abs = Math.abs(n);
    var s = abs.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return (opts.noSign ? "" : sign) + "$" + s;
  }
  function fmtPct(n, opts) {
    if (typeof n !== "number" || isNaN(n)) return "—";
    opts = opts || {};
    var sign = n > 0 ? "+" : n < 0 ? "−" : "";
    return (opts.noSign ? "" : sign) + Math.abs(n).toFixed(2) + (opts.unit || "%");
  }
  function fmtPP(n) {
    if (typeof n !== "number" || isNaN(n)) return "—";
    var sign = n > 0 ? "+" : n < 0 ? "−" : "";
    return sign + Math.abs(n).toFixed(2) + "pp";
  }
  function signClass(n) {
    if (typeof n !== "number" || isNaN(n)) return "neutral";
    return n > 0 ? "good" : n < 0 ? "bad" : "neutral";

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {

  function fmtLevels(levels, keys) {

    if (!vals.length) return { main: "—", sub: "" };
    var main = fmtUSD(vals[0], { noSign: true });
    var sub = vals.slice(1).map(function (v) { return fmtUSD(v, { noSign: true }); }).join(" / ");
    return { main: main, sub: sub };
  }

  // ---------- Equity curve (inline SVG, built from history.json) ----------
  function buildEquityCurveSVG() {
    var wrap = document.createElement("div");
    wrap.className = "card chart-card";
    var title = document.createElement("div");
    title.className = "section-title";
    title.style.margin = "0 0 12px";
    title.textContent = "Equity curve vs SPY (since tracking began" + (history.tracking_start_date ? " " + history.tracking_start_date : "") + ")";
    wrap.appendChild(title);

    if (historyRows.length < 2) {
      var empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = "Equity curve will appear once more daily history has been collected (currently " + historyRows.length + " day" + (historyRows.length === 1 ? "" : "s") + ").";
      wrap.appendChild(empty);
      return wrap;
    }

    var baseEquity = historyRows[0].equity_value;
    var basePortfolioValue = historyRows[0].portfolio_value;
    var portfolioSeries = [];
    var spySeries = [];
    var spyCum = 0;
    historyRows.forEach(function (r, i) {
      var portCum = baseEquity ? ((r.equity_value / baseEquity) - 1) * 100 : 0;
      if (i === 0) spyCum = 0;
      else if (typeof r.spy_today_pct === "number") spyCum = ((1 + spyCum / 100) * (1 + r.spy_today_pct / 100) - 1) * 100;
      portfolioSeries.push(portCum);
      spySeries.push(spyCum);
    });

    var W = 900, H = 260, padL = 46, padR = 16, padT = 16, padB = 28;
    var allVals = portfolioSeries.concat(spySeries);
    var minV = Math.min.apply(null, allVals.concat([0]));
    var maxV = Math.max.apply(null, allVals.concat([0]));
    if (minV === maxV) { minV -= 1; maxV += 1; }
    var rangePad = (maxV - minV) * 0.08;
    minV -= rangePad; maxV += rangePad;

    function x(i) { return padL + (i / (historyRows.length - 1)) * (W - padL - padR); }
    function y(v) { return H - padB - ((v - minV) / (maxV - minV)) * (H - padT - padB); }

    function pathFor(series) {
      return series.map(function (v, i) { return (i === 0 ? "M" : "L") + x(i).toFixed(1) + "," + y(v).toFixed(1); }).join(" ");
    }

    var zeroY = y(0).toFixed(1);
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Equity curve vs SPY">' +
      '<line x1="' + padL + '" y1="' + zeroY + '" x2="' + (W - padR) + '" y2="' + zeroY + '" stroke="currentColor" stroke-opacity="0.15" stroke-width="1" />' +
      '<text x="6" y="' + (Number(zeroY) + 4) + '" font-size="10" fill="currentColor" fill-opacity="0.5">0%</text>' +
      '<text x="6" y="' + (padT + 8) + '" font-size="10" fill="currentColor" fill-opacity="0.5">' + maxV.toFixed(1) + '%</text>' +
      '<text x="6" y="' + (H - padB) + '" font-size="10" fill="currentColor" fill-opacity="0.5">' + minV.toFixed(1) + '%</text>' +
      '<path d="' + pathFor(spySeries) + '" fill="none" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="4 3" />' +
      '<path d="' + pathFor(portfolioSeries) + '" fill="none" stroke="var(--accent)" stroke-width="2.5" />' +
      '<text x="' + (W - padR) + '" y="' + (H - 8) + '" font-size="10" fill="currentColor" fill-opacity="0.5" text-anchor="end">' + esc(historyRows[historyRows.length - 1].date || "") + '</text>' +
      '<text x="' + padL + '" y="' + (H - 8) + '" font-size="10" fill="currentColor" fill-opacity="0.5">' + esc(historyRows[0].date || "") + '</text>' +
      '</svg>';

    var legend = document.createElement("div");
    legend.className = "chart-legend";
    var lastPort = portfolioSeries[portfolioSeries.length - 1];
    var lastSpy = spySeries[spySeries.length - 1];
    legend.innerHTML =
      '<span><span class="swatch" style="background:var(--accent)"></span>Portfolio ' + fmtPct(lastPort) + '</span>' +
      '<span><span class="swatch" style="background:var(--text-faint)"></span>SPY ' + fmtPct(lastSpy) + '</span>';
    wrap.appendChild(legend);

    var svgWrap = document.createElement("div");
    svgWrap.innerHTML = svg;
    wrap.appendChild(svgWrap);

    var caption = document.createElement("div");
    caption.className = "chart-caption";
    caption.textContent = "Cumulative % return, rebased to 0% at tracking start. Not a benchmark for any period before tracking began.";
    wrap.appendChild(caption);

    return wrap;
  }

      if (p.next_earnings) {
        var daysOut = Math.round((new Date(p.next_earnings) - new Date(daily.date)) / 86400000);
        if (daysOut >= 0 && daysOut <= 30) tags.push('<span class="tag catalyst">Earnings ' + esc(p.next_earnings) + ' (' + daysOut + 'd)</span>');
      }
      if (p.insider_notes) tags.push('<span class="tag insider">Insider activity (best-effort search, not verified SEC filings)</span>');
      var rec = recommendations.filter(function (r) { return r.ticker === p.ticker; })[0];
      if (rec && rec.rec_type === "risk-change") tags.push('<span class="tag risk">Risk change</span>');
      if (rec && (rec.rec_type === "trim")) tags.push('<span class="tag risk">Trim flag</span>');

      var item = document.createElement("div");
      item.className = "card feed-item";
      item.innerHTML =
        '<div class="feed-ticker-col"><span class="t">' + esc(p.ticker) + '</span>' +
        '<span class="pos-chip ' + signClass(p.today_pct) + '" style="min-width:auto;">' + fmtPct(p.today_pct) + '</span></div>' +
        '<div class="feed-body">' +
          '<div class="feed-tags">' + tags.join("") + '</div>' +
          '<ul class="news-list">' + p.news.map(renderNewsItem).join("") + '</ul>' +
        '</div>';
      el.appendChild(item);
    });
  })();

  // ---------- Notes footer ----------
  if (notes && notes.length) {
    var footer = document.getElementById("notes-footer");
    footer.style.display = "block";
    footer.innerHTML = "<strong>Data notes</strong><ul>" + notes.map(function (n) { return "<li>" + esc(n) + "</li>"; }).join("") + "</ul>";
  }
})();
</script>
