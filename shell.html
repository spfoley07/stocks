<script>
(function () {
  "use strict";

  function parseJSONBlock(id) {
    var el = document.getElementById(id);
    if (!el) return {};
    try { return JSON.parse(el.textContent); } catch (e) { return {}; }
  }

  var daily = parseJSONBlock("daily-data-json");
  var weekly = parseJSONBlock("weekly-cache-json");
  var positions = daily.positions || [];
  var totals = daily.totals || {};
  var recommendations = daily.recommendations || [];
  var notes = daily.notes || [];
  var weeklyPositions = (weekly && weekly.positions) || {};

  var REC_LABELS = {
    "trim": "TRIM", "add-consideration": "ADD", "overbought": "OVERBOUGHT",
    "oversold": "OVERSOLD", "binary-catalyst": "CATALYST", "risk-change": "RISK"
  };
  var REC_ACCENT = {
    "binary-catalyst": "accent-blue", "add-consideration": "accent-green", "risk-change": "accent-red"
  };
  function accentClass(recType) { return REC_ACCENT[recType] || "accent-yellow"; }

  function fmtUSD(n, opts) {
    opts = opts || {};
    n = Number(n) || 0;
    var s = Math.abs(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    var sign = n < 0 ? "-" : (opts.forceSign ? "+" : "");
    return sign + "$" + s;
  }
  function fmtPct(n, decimals) {
    n = Number(n) || 0;
    var s = n.toFixed(decimals == null ? 2 : decimals);
    return (n > 0 ? "+" : "") + s + "%";
  }
  function signClass(n) { return Number(n) >= 0 ? "pos" : "neg"; }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function daysUntil(dateStr) {
    if (!dateStr) return null;
    var target = new Date(dateStr + "T00:00:00Z").getTime();
    var today = new Date(daily.date + "T00:00:00Z").getTime();
    return Math.round((target - today) / 86400000);
  }
  function sentimentArrow(sentiment) {
    if (sentiment === "good") return '<span class="arrow-up">▲</span>';
    if (sentiment === "bad") return '<span class="arrow-down">▼</span>';
    return "";
  }
  function newsLineHTML(item) {
    if (!item) return "";
    var sentiment = item.sentiment;
    if (sentiment !== "good" && sentiment !== "bad" && sentiment !== "neutral") {
      sentiment = null;
    }
    var cls = sentiment == null || sentiment === "neutral" ? "news-neutral" : "";
    return '<li class="' + cls + '">' + sentimentArrow(sentiment) + esc(item.text) + "</li>";
  }

  // ---------- Top bar ----------
  (function renderTopbar() {
    var el = document.getElementById("topbar-inner");
    var val = fmtUSD(totals.portfolio_value);
    var chgCls = signClass(totals.today_pct);
    var mover = totals.biggest_mover || {};
    el.innerHTML =
      '<div class="tb-value">' + val + "</div>" +
      '<div class="tb-change ' + chgCls + '">' + fmtUSD(totals.today_dollars, { forceSign: true }) + " (" + fmtPct(totals.today_pct) + ") today</div>" +
      '<div class="tb-sub">Unrealized P/L: <span class="' + signClass(totals.unrealized_pl) + '">' + fmtUSD(totals.unrealized_pl, { forceSign: true }) + "</span></div>" +
      '<div class="tb-mover">Biggest mover: <strong>' + esc(mover.ticker || "—") + "</strong> " + fmtPct(mover.today_pct) + "</div>";
  })();

  // ---------- Tabs ----------
  var tabBtns = Array.prototype.slice.call(document.querySelectorAll(".tab-btn"));
  var panels = {
    overview: document.getElementById("panel-overview"),
    positions: document.getElementById("panel-positions"),
    watchlist: document.getElementById("panel-watchlist")
  };
  tabBtns.forEach(function (btn) {
    btn.addEventListener("click", function () {
      tabBtns.forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      Object.keys(panels).forEach(function (k) { panels[k].classList.remove("active"); });
      panels[btn.getAttribute("data-tab")].classList.add("active");
    });
  });

  // ---------- Dismissals ----------
  var DISMISS_KEY = "portfolio_dismissals_v1";
  function loadDismissals() {
    try { return JSON.parse(localStorage.getItem(DISMISS_KEY) || "[]"); } catch (e) { return []; }
  }
  function saveDismissals(list) {
    try { localStorage.setItem(DISMISS_KEY, JSON.stringify(list)); } catch (e) {}
  }
  function isMateriallyWorse(prevTrigger, curTrigger, recType) {
    var prev = Number(prevTrigger), cur = Number(curTrigger);
    if (isNaN(prev) || isNaN(cur)) return false;
    if (recType === "trim" || recType === "add-consideration") return cur >= prev + 2;
    if (recType === "oversold") return cur <= prev - 10;
    if (recType === "overbought") return cur >= prev + 10;
    return false;
  }
  function dismissKey(rec) { return rec.ticker + "::" + rec.rec_type; }
  function shouldShowRec(rec) {
    var dismissals = loadDismissals();
    var match = null;
    for (var i = 0; i < dismissals.length; i++) {
      if (dismissals[i].ticker === rec.ticker && dismissals[i].rec_type === rec.rec_type) { match = dismissals[i]; break; }
    }
    if (!match) return true;
    var ageDays = (Date.parse(daily.date) - Date.parse(match.date)) / 86400000;
    if (ageDays >= 14) return true;
    return isMateriallyWorse(match.trigger_value, rec.trigger_value, rec.rec_type);
  }
  function dismissRec(rec) {
    var dismissals = loadDismissals().filter(function (d) {
      return !(d.ticker === rec.ticker && d.rec_type === rec.rec_type);
    });
    dismissals.push({ ticker: rec.ticker, rec_type: rec.rec_type, trigger_value: rec.trigger_value, date: daily.date || new Date().toISOString().slice(0, 10) });
    saveDismissals(dismissals);
  }

  function triggerLabel(rec) {
    var v = Number(rec.trigger_value);
    if (isNaN(v)) return "";
    if (rec.rec_type === "oversold" || rec.rec_type === "overbought" || rec.rec_type === "add-consideration") return "RSI " + v.toFixed(1);
    if (rec.rec_type === "binary-catalyst") return v + (v === 1 ? " day" : " days");
    return v.toFixed(1) + "%";
  }

  function severityScore(rec) {
    var v = Number(rec.trigger_value) || 0;
    switch (rec.rec_type) {
      case "binary-catalyst": return 100 - v;
      case "oversold": return 100 - v;
      case "overbought": return v;
      case "add-consideration": return 100 - v;
      case "trim": return v;
      case "risk-change": return v;
      default: return v;
    }
  }

  // ---------- Overview: gainer / loser ----------
  (function buildGainerLoser() {
    var sorted = positions.slice().sort(function (a, b) { return (b.today_pct || 0) - (a.today_pct || 0); });
    var gainer = sorted[0];
    var loser = sorted[sorted.length - 1];
    var gEl = document.getElementById("card-gainer");
    var lEl = document.getElementById("card-loser");
    function moverHTML(p) {
      if (!p) return '<div class="mover-empty">No data</div>';
      return '<div class="mover-ticker">' + esc(p.ticker) + "</div>" +
        '<div class="mover-pct ' + signClass(p.today_pct) + '">' + fmtPct(p.today_pct) + "</div>" +
        '<div class="mover-dollar ' + signClass(p.today_dollars) + '">' + fmtUSD(p.today_dollars, { forceSign: true }) + " today · " + fmtUSD(p.market_value) + " value</div>";
    }
    gEl.innerHTML = "<h3>Biggest Gainer</h3>" + moverHTML(gainer && gainer.today_pct > 0 ? gainer : null);
    lEl.innerHTML = "<h3>Biggest Loser</h3>" + moverHTML(loser && loser.today_pct < 0 ? loser : null);
  })();

  // ---------- Overview: recommendation / risk carousels ----------
  function buildCarousel(containerId, title, recType) {
    var container = document.getElementById(containerId);
    var pool = recommendations.filter(function (r) {
      return recType === "risk-change" ? r.rec_type === "risk-change" : r.rec_type !== "risk-change";
    }).filter(shouldShowRec).sort(function (a, b) { return severityScore(b) - severityScore(a); }).slice(0, 3);

    if (!pool.length) {
      container.innerHTML = "<h3>" + title + "</h3><div class='rec-empty'>" +
        (recType === "risk-change" ? "No risk changes today." : "No recommendations today.") + "</div>";
      return;
    }

    var idx = 0;
    container.innerHTML = "<h3>" + title + "</h3>" +
      '<div class="rec-slide" id="' + containerId + '-slide"></div>' +
      '<div class="rec-nav">' +
      '<button class="rec-arrow" id="' + containerId + '-prev">‹</button>' +
      '<div class="rec-dots" id="' + containerId + '-dots"></div>' +
      '<button class="rec-arrow" id="' + containerId + '-next">›</button>' +
      "</div>";

    var slideEl = document.getElementById(containerId + "-slide");
    var dotsEl = document.getElementById(containerId + "-dots");
    var prevBtn = document.getElementById(containerId + "-prev");
    var nextBtn = document.getElementById(containerId + "-next");

    function render() {
      var rec = pool[idx];
      slideEl.innerHTML =
        '<div class="rec-face ' + accentClass(rec.rec_type) + '">' +
          '<div class="rec-top"><span class="rec-ticker">' + esc(rec.ticker) + '</span>' +
          '<span class="rec-badge">' + esc(REC_LABELS[rec.rec_type] || rec.rec_type) + '</span>' +
          '<span class="rec-trigger">' + triggerLabel(rec) + "</span></div>" +
          '<div class="rec-rationale">' + esc(rec.rationale) + "</div>" +
        "</div>" +
        '<button class="rec-dismiss" type="button">Dismiss</button>';
      slideEl.querySelector(".rec-dismiss").addEventListener("click", function () {
        dismissRec(rec);
        pool = pool.filter(function (r) { return !(r.ticker === rec.ticker && r.rec_type === rec.rec_type); });
        if (!pool.length) { buildCarousel(containerId, title, recType); return; }
        idx = Math.min(idx, pool.length - 1);
        render();
      });
      dotsEl.innerHTML = "";
      pool.forEach(function (r, i) {
        var dot = document.createElement("button");
        dot.className = "rec-dot" + (i === idx ? " active" : "");
        dot.type = "button";
        dot.addEventListener("click", function () { idx = i; render(); });
        dotsEl.appendChild(dot);
      });
      prevBtn.disabled = pool.length <= 1;
      nextBtn.disabled = pool.length <= 1;
    }
    prevBtn.addEventListener("click", function () { idx = (idx - 1 + pool.length) % pool.length; render(); });
    nextBtn.addEventListener("click", function () { idx = (idx + 1) % pool.length; render(); });
    render();
  }
  buildCarousel("card-recs", "Recommendations", "recs");
  buildCarousel("card-risk", "Risk Changes", "risk-change");

  // ---------- Positions tab ----------
  var SECTOR_ORDER_CACHE = null;
  function sectorTotals() {
    if (SECTOR_ORDER_CACHE) return SECTOR_ORDER_CACHE;
    var map = {};
    positions.forEach(function (p) {
      var s = p.sector || "Other";
      if (!map[s]) map[s] = { sector: s, value: 0, items: [] };
      map[s].value += p.market_value || 0;
      map[s].items.push(p);
    });
    var totalValue = totals.portfolio_value || positions.reduce(function (a, p) { return a + (p.market_value || 0); }, 0);
    var groups = Object.keys(map).map(function (k) { return map[k]; });
    groups.sort(function (a, b) { return b.value - a.value; });
    groups.forEach(function (g) {
      g.items.sort(function (a, b) { return (b.market_value || 0) - (a.market_value || 0); });
      g.share = totalValue ? (g.value / totalValue * 100) : 0;
    });
    SECTOR_ORDER_CACHE = groups;
    return groups;
  }

  (function buildPositions() {
    var toolbar = document.getElementById("pos-toolbar");
    var listEl = document.getElementById("pos-list");
    var openTickers = {};

    var sorts = [
      { key: "value", label: "Value" },
      { key: "gain", label: "% Gain/Loss" },
      { key: "sector", label: "Sector" }
    ];
    var state = { key: "value", dir: -1 };

    function rightBlockHTML(p, sortKey) {
      if (sortKey === "gain") {
        return '<div class="top">' + fmtUSD(p.market_value) + '</div>' +
          '<div class="bottom ' + signClass(p.unrealized_pl_pct) + '">' + fmtPct(p.unrealized_pl_pct, 1) + ' since buy</div>';
      }
      return '<div class="top">' + fmtUSD(p.market_value) + '</div>' +
        '<div class="bottom ' + signClass(p.today_pct) + '">' + fmtPct(p.today_pct) + ' today</div>';
    }

    function positionCardHTML(p, sortKey) {
      var open = openTickers[p.ticker] ? " open" : "";
      var supportStr = p.support ? [p.support.s1, p.support.s2, p.support.s3].filter(function (x) { return x != null; }).map(function (x) { return x.toLocaleString(undefined, { maximumFractionDigits: 2 }); }).join(" / ") : "—";
      var resistStr = p.resistance ? [p.resistance.r1, p.resistance.r2, p.resistance.r3].filter(function (x) { return x != null; }).map(function (x) { return x.toLocaleString(undefined, { maximumFractionDigits: 2 }); }).join(" / ") : "—";
      var earningsStr = p.next_earnings ? p.next_earnings + " (" + daysUntil(p.next_earnings) + "d)" : "TBD";
      var flags = [];
      if (p.rsi != null && p.rsi < 30) flags.push('<span class="flag-chip warnchip">Oversold RSI ' + p.rsi.toFixed(1) + '</span>');
      if (p.rsi != null && p.rsi > 70) flags.push('<span class="flag-chip warnchip">Overbought RSI ' + p.rsi.toFixed(1) + '</span>');
      var dte = daysUntil(p.next_earnings);
      if (dte != null && dte >= 0 && dte <= 30) flags.push('<span class="flag-chip">Catalyst in ' + dte + 'd</span>');
      if (p.insider_bullish) flags.push('<span class="flag-chip goodchip">Insider buying (best-effort search, not verified SEC filings)</span>');
      var wk = weeklyPositions[p.ticker];
      var insiderHTML = wk && wk.insider_notes ? '<div class="insider-note">' + esc(wk.insider_notes) + '</div>' : "";
      var newsHTML = (p.news && p.news.length) ? '<ul class="news-list">' + p.news.map(newsLineHTML).join("") + '</ul>' : '<div class="empty-state">No material news.</div>';

      return '<div class="pos-card' + open + '" data-ticker="' + esc(p.ticker) + '">' +
        '<div class="pos-head">' +
          '<div class="pos-left">' +
            '<div class="ticker">' + esc(p.ticker) + '</div>' +
            '<div class="sub">' + fmtUSD(p.current_price, {}) + ' vs ' + fmtUSD(p.avg_cost_per_share, {}) + ' cost · target ' + fmtUSD(p.analyst_target, {}) + ' · ' + p.shares.toLocaleString(undefined, { maximumFractionDigits: 4 }) + ' sh</div>' +
          '</div>' +
          '<div class="pos-right">' + rightBlockHTML(p, sortKey) + '</div>' +
        '</div>' +
        '<div class="pos-body">' +
          '<div class="pos-grid">' +
            '<div class="pos-stat"><div class="k">Support</div><div class="v">' + supportStr + '</div></div>' +
            '<div class="pos-stat"><div class="k">Resistance</div><div class="v">' + resistStr + '</div></div>' +
            '<div class="pos-stat"><div class="k">RSI</div><div class="v">' + (p.rsi != null ? p.rsi.toFixed(1) : "—") + '</div></div>' +
            '<div class="pos-stat"><div class="k">Next earnings</div><div class="v">' + earningsStr + '</div></div>' +
            '<div class="pos-stat"><div class="k">Sector</div><div class="v">' + esc(p.sector || "Other") + '</div></div>' +
            '<div class="pos-stat"><div class="k">Account</div><div class="v">' + esc(p.account) + '</div></div>' +
          '</div>' +
          (flags.length ? '<div class="flags">' + flags.join("") + '</div>' : '') +
          newsHTML +
          insiderHTML +
        '</div>' +
      '</div>';
    }

    function attachCardHandlers(root) {
      root.querySelectorAll(".pos-head").forEach(function (head) {
        head.addEventListener("click", function () {
          var card = head.closest(".pos-card");
          var ticker = card.getAttribute("data-ticker");
          card.classList.toggle("open");
          openTickers[ticker] = card.classList.contains("open");
        });
      });
    }

    function renderToolbar() {
      toolbar.innerHTML = "";
      sorts.forEach(function (s) {
        var b = document.createElement("button");
        b.className = "sort-btn" + (state.key === s.key ? " active" : "");
        var dirArrow = state.key === s.key && s.key !== "sector" ? (state.dir === -1 ? " ↓" : " ↑") : "";
        b.innerHTML = esc(s.label) + '<span class="dir">' + dirArrow + '</span>';
        b.addEventListener("click", function () {
          if (state.key === s.key && s.key !== "sector") {
            state.dir *= -1;
          } else {
            state.key = s.key;
            state.dir = -1;
          }
          renderToolbar();
          renderList();
        });
        toolbar.appendChild(b);
      });
    }

    function renderList() {
      var html = "";
      if (state.key === "sector") {
        sectorTotals().forEach(function (g) {
          html += '<div class="sector-header"><span>' + esc(g.sector) + '</span><span class="share">' + fmtUSD(g.value) + ' · ' + g.share.toFixed(1) + '% of portfolio</span></div>';
          g.items.forEach(function (p) { html += positionCardHTML(p, "value"); });
        });
      } else if (state.key === "gain") {
        var list = positions.slice().sort(function (a, b) { return state.dir * ((b.unrealized_pl_pct || 0) - (a.unrealized_pl_pct || 0)); });
        list.forEach(function (p) { html += positionCardHTML(p, "gain"); });
      } else {
        var list2 = positions.slice().sort(function (a, b) { return state.dir * ((b.market_value || 0) - (a.market_value || 0)); });
        list2.forEach(function (p) { html += positionCardHTML(p, "value"); });
      }
      listEl.innerHTML = html;
      attachCardHandlers(listEl);
    }

    renderToolbar();
    renderList();
  })();

  // ---------- Watchlist & News ----------
  (function buildWatchlist() {
    var feedEl = document.getElementById("feed-list");
    var filterInput = document.getElementById("ticker-filter");
    var toggleEl = document.getElementById("flag-toggles");
    var activeFlags = {};

    var FLAGS = [
      { key: "oversold", label: "Oversold (RSI<30)", test: function (p) { return p.rsi != null && p.rsi < 30; } },
      { key: "overbought", label: "Overbought (RSI>70)", test: function (p) { return p.rsi != null && p.rsi > 70; } },
      { key: "catalyst", label: "Catalyst ≤30d", test: function (p) { var d = daysUntil(p.next_earnings); return d != null && d >= 0 && d <= 30; } },
      { key: "insider", label: "Insider signal", test: function (p) { return !!p.insider_bullish; } },
      { key: "risk", label: "Risk change", test: function (p) { return recommendations.some(function (r) { return r.ticker === p.ticker && r.rec_type === "risk-change"; }); } }
    ];

    FLAGS.forEach(function (f) {
      var b = document.createElement("button");
      b.className = "flag-toggle";
      b.type = "button";
      b.textContent = f.label;
      b.addEventListener("click", function () {
        activeFlags[f.key] = !activeFlags[f.key];
        b.classList.toggle("active", activeFlags[f.key]);
        render();
      });
      toggleEl.appendChild(b);
    });

    function matchesFlags(p) {
      var keys = Object.keys(activeFlags).filter(function (k) { return activeFlags[k]; });
      if (!keys.length) return true;
      return keys.some(function (k) {
        var f = FLAGS.filter(function (x) { return x.key === k; })[0];
        return f && f.test(p);
      });
    }

    function render() {
      var q = (filterInput.value || "").trim().toUpperCase();
      var items = [];
      positions.forEach(function (p) {
        if (q && p.ticker.toUpperCase().indexOf(q) === -1) return;
        if (!matchesFlags(p)) return;
        (p.news || []).forEach(function (n) {
          items.push({ ticker: p.ticker, text: n.text, sentiment: n.sentiment, source_date: n.source_date || daily.date });
        });
      });
      items.sort(function (a, b) { return Date.parse(b.source_date) - Date.parse(a.source_date); });
      if (!items.length) {
        feedEl.innerHTML = '<div class="empty-state">No matching news items.</div>';
        return;
      }
      feedEl.innerHTML = items.map(function (it) {
        var sentiment = it.sentiment;
        if (sentiment !== "good" && sentiment !== "bad" && sentiment !== "neutral") sentiment = null;
        return '<div class="feed-item">' +
          '<div class="feed-meta"><span class="fdate">' + esc(it.source_date) + '</span></div>' +
          '<div class="feed-body"><span class="feed-ticker">' + esc(it.ticker) + '</span>' +
          sentimentArrow(sentiment) +
          '<span class="' + (sentiment == null || sentiment === "neutral" ? "news-neutral" : "") + '">' + esc(it.text) + '</span></div>' +
        '</div>';
      }).join("");
    }

    filterInput.addEventListener("input", render);
    render();
  })();

  // ---------- Footnotes ----------
  (function buildNotes() {
    var el = document.getElementById("data-notes");
    if (!notes.length) { el.innerHTML = ""; return; }
    el.innerHTML = "<strong>Data notes</strong><ul>" + notes.map(function (n) { return "<li>" + esc(n) + "</li>"; }).join("") + "</ul>";
  })();
})();
</script>
