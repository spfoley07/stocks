<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>PORTFOLIO // TACTICAL BRIEF</title>
<style>
:root{
  --bg:#04080e; --panel:#080f18; --panel2:#0b1522;
  --line:#12324a; --line-hot:#1d5a7a;
  --cy:#22d3ee; --cy-dim:#0e7490; --cy-glow:rgba(34,211,238,.35);
  --up:#34d399; --down:#fb7185; --warn:#fbbf24;
  --txt:#e2e8f0; --mut:#7c96ad;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt); font-family:var(--sans);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  background-image:
    linear-gradient(rgba(34,211,238,.022) 1px,transparent 1px),
    linear-gradient(90deg,rgba(34,211,238,.022) 1px,transparent 1px);
  background-size:44px 44px;
}
body::after{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:99;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);
  opacity:.5;
}
.mono{font-family:var(--mono)}
.lbl{
  font-family:var(--mono); font-size:9.5px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--mut); white-space:nowrap;
}
.up{color:var(--up)} .down{color:var(--down)} .warn{color:var(--warn)} .cy{color:var(--cy)}

/* ---- corner-bracket frame ---- */
.brk{position:relative; background:var(--panel); border:1px solid var(--line)}
.brk::before,.brk::after{
  content:""; position:absolute; width:11px; height:11px; pointer-events:none;
  border-color:var(--cy); border-style:solid;
}
.brk::before{top:-1px;left:-1px;border-width:1px 0 0 1px}
.brk::after{bottom:-1px;right:-1px;border-width:0 1px 1px 0}
.brk>.c2,.brk>.c3{position:absolute;width:11px;height:11px;border-color:var(--cy);border-style:solid;pointer-events:none}
.brk>.c2{top:-1px;right:-1px;border-width:1px 1px 0 0}
.brk>.c3{bottom:-1px;left:-1px;border-width:0 0 1px 1px}

/* ---- header ---- */
header{
  position:sticky; top:0; z-index:50; background:rgba(4,8,14,.96);
  border-bottom:1px solid var(--line-hot);
  box-shadow:0 0 24px rgba(34,211,238,.07);
  backdrop-filter:blur(6px);
}
.hbar{display:flex;align-items:center;gap:8px;padding:6px 14px;border-bottom:1px solid var(--line)}
.hbar .tag{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--cy)}
.hbar .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--line-hot),transparent)}
.blocks{display:flex;gap:3px}
.blocks i{width:13px;height:7px;background:var(--line);display:block}
.blocks i.on{background:var(--cy);box-shadow:0 0 6px var(--cy-glow)}
.stats{display:flex;flex-wrap:wrap;gap:0;padding:9px 14px 11px}
.stat{padding:0 18px 0 0;margin-right:18px;border-right:1px solid var(--line);min-width:118px}
.stat:last-child{border-right:0}
.stat .v{font-family:var(--mono);font-size:19px;font-weight:600;letter-spacing:-.01em;margin-top:2px;line-height:1.15}
.stat .v small{font-size:12px;font-weight:400;opacity:.85;margin-left:5px}
.asof{margin-left:auto;align-self:flex-end;font-family:var(--mono);font-size:10px;color:var(--mut);letter-spacing:.08em}

/* ---- tabs ---- */
nav{display:flex;gap:0;padding:0 14px;border-bottom:1px solid var(--line);background:var(--panel)}
nav button{
  background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);
  font-family:var(--mono);font-size:11px;letter-spacing:.15em;text-transform:uppercase;
  padding:11px 16px;cursor:pointer;transition:.15s;
}
nav button:hover{color:var(--txt)}
nav button.act{color:var(--cy);border-bottom-color:var(--cy);text-shadow:0 0 10px var(--cy-glow)}

main{padding:16px 14px 60px;max-width:1400px;margin:0 auto}
.pane{display:none} .pane.act{display:block}
.grid{display:grid;gap:12px}
@media(min-width:900px){.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}}

.card{padding:13px 15px}
.card h3{margin:0 0 9px;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--cy);font-weight:500}
.big{font-family:var(--mono);font-size:22px;font-weight:600}
.sub{font-size:12px;color:var(--mut);margin-top:3px}

/* ---- ring gauges ---- */
.rings{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.ring{display:flex;align-items:center;gap:9px;min-width:168px}
.ring svg{flex:none}
.ring .rt{font-family:var(--mono);font-size:11px;color:var(--txt);line-height:1.35}
.ring .rt b{display:block;font-size:14px;font-weight:600}
.ring .rt span{color:var(--mut);font-size:10px;letter-spacing:.06em}

/* ---- equity curve ---- */
.curve{width:100%;height:170px;display:block}
.empty{font-family:var(--mono);font-size:11px;color:var(--mut);letter-spacing:.1em;padding:34px 0;text-align:center;border:1px dashed var(--line)}

/* ---- recommendations ---- */
.rec{padding:11px 13px;margin-bottom:9px;border-left:2px solid var(--cy)}
.rec.sev1{border-left-color:var(--down)} .rec.sev2{border-left-color:var(--warn)}
.rec .rh{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.rec .tk{font-family:var(--mono);font-weight:700;font-size:14px;letter-spacing:.04em}
.chip{
  font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  padding:2px 7px;border:1px solid var(--line-hot);color:var(--cy);background:rgba(34,211,238,.07);
}
.rec p{margin:7px 0 0;font-size:13px;color:#cbd8e4;line-height:1.55}
.dis{
  margin-left:auto;background:none;border:1px solid var(--line);color:var(--mut);
  font-family:var(--mono);font-size:9px;letter-spacing:.12em;padding:3px 9px;cursor:pointer;text-transform:uppercase;
}
.dis:hover{border-color:var(--down);color:var(--down)}

/* ---- position cards ---- */
.sorts{display:flex;gap:7px;margin-bottom:12px}
.sorts button{
  background:var(--panel2);border:1px solid var(--line);color:var(--mut);
  font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  padding:6px 12px;cursor:pointer;
}
.sorts button.act{border-color:var(--cy);color:var(--cy);background:rgba(34,211,238,.09)}
.pos{margin-bottom:10px}
.ph{display:flex;align-items:center;gap:13px;padding:12px 15px;cursor:pointer;flex-wrap:wrap}
.ph:hover{background:rgba(34,211,238,.035)}
.ph .id{min-width:112px}
.ph .id b{font-family:var(--mono);font-size:15px;letter-spacing:.05em;display:block}
.ph .id span{font-size:10.5px;color:var(--cy-dim);letter-spacing:.05em}
.ph .meta{flex:1;font-family:var(--mono);font-size:11.5px;color:var(--mut);min-width:230px}
.ph .val{text-align:right;font-family:var(--mono)}
.ph .val b{font-size:15px;display:block}
.ph .val span{font-size:12px}
.pb{display:none;padding:0 15px 14px;border-top:1px solid var(--line)}
.pos.open .pb{display:block}
.pb .row{display:grid;gap:6px 22px;padding:11px 0 0}
@media(min-width:760px){.pb .row{grid-template-columns:1fr 1fr}}
.f{font-size:12.5px;line-height:1.55}
.f b{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--mut);margin-right:7px}
.f .fv{font-family:var(--mono)}
.stale{color:var(--warn);font-size:11px;font-family:var(--mono)}
.notes{margin-top:11px;padding-top:10px;border-top:1px solid var(--line);font-size:12.5px;color:#b6c6d6;line-height:1.6}
.notes .cap{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--mut);display:block;margin-bottom:4px}

/* ---- news ---- */
.nw{padding:11px 0;border-top:1px solid var(--line)}
.nw:first-child{border-top:0}
.nw .nh{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.sent{font-family:var(--mono);font-size:9px;letter-spacing:.11em;text-transform:uppercase;padding:2px 7px;flex:none}
.sent.good{background:rgba(52,211,153,.14);color:var(--up);border:1px solid rgba(52,211,153,.3)}
.sent.bad{background:rgba(251,113,133,.14);color:var(--down);border:1px solid rgba(251,113,133,.3)}
.sent.neutral{background:rgba(124,150,173,.12);color:var(--mut);border:1px solid var(--line)}
.nw .hl{font-weight:600;font-size:13.5px;color:#f1f5f9;line-height:1.5}
.nw .wy{font-size:12.5px;color:#9fb2c4;margin-top:5px;line-height:1.6}
.nw .tkr{font-family:var(--mono);font-size:11px;color:var(--cy);letter-spacing:.06em;font-weight:600}
.flag{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.11em;text-transform:uppercase;padding:2px 7px;border:1px solid var(--warn);color:var(--warn);margin-right:6px}
.foot{font-family:var(--mono);font-size:10px;color:var(--mut);letter-spacing:.08em;text-align:center;padding:22px 0 0}
</style>
</head>
<body>

<header>
  <div class="hbar">
    <span class="tag">&gt; PORTFOLIO TACTICAL BRIEF</span>
    <span class="rule"></span>
    <span class="blocks"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i></span>
  </div>
  <div class="stats" id="stats"></div>
</header>

<nav>
  <button class="act" data-p="ov">Overview</button>
  <button data-p="po">Positions</button>
  <button data-p="nw">Watchlist &amp; News</button>
</nav>

<main>
  <section class="pane act" id="ov"></section>
  <section class="pane" id="po"></section>
  <section class="pane" id="nw"></section>
  <div class="foot">// END OF BRIEF //</div>
</main>

<script>
(function(){
"use strict";
var J=function(id){try{return JSON.parse(document.getElementById(id).textContent||"{}")}catch(e){return {}}};
var D=J("daily-data"), H=J("history");
var P=D.positions||[], T=D.totals||{}, TH=D.themes||{}, R=D.recommendations||[], C=D.cash||{};

var n=function(v){return typeof v==="number"&&isFinite(v)};
var money=function(v,d){return n(v)?(v<0?"−":"")+"$"+Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:d==null?2:d,maximumFractionDigits:d==null?2:d}):"—"};
var pct=function(v){return n(v)?(v>0?"+":v<0?"−":"")+Math.abs(v).toFixed(2)+"%":"—"};
var cls=function(v){return n(v)?(v>0?"up":v<0?"down":""):""};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var el=function(h){var d=document.createElement("div");d.innerHTML=h;return d};
var brk=function(cl,h){return '<div class="brk '+cl+'"><span class="c2"></span><span class="c3"></span>'+h+'</div>'};

/* ---------- sticky bar ---------- */
(function(){
  var s=[];
  s.push(['Portfolio Value', money(T.portfolio_value), '']);
  s.push(['Today', pct(T.today_pct)+'<small>'+money(T.today_dollars)+'</small>', cls(T.today_pct)]);
  s.push(['Total Return', money(T.total_return)+'<small>'+pct(T.total_return_pct)+'</small>', cls(T.total_return)]);
  s.push(['Unrealized P/L', money(T.unrealized_pl)+'<small>'+pct(T.unrealized_pl_pct)+'</small>', cls(T.unrealized_pl)]);
  var bm=T.biggest_mover||{};
  if(bm.ticker) s.push(['Biggest Mover', esc(bm.ticker)+'<small>'+pct(bm.today_pct)+'</small>', cls(bm.today_pct)]);
  if(C.display && n(C.total)) s.push(['Cash', money(C.total), '']);
  var h=s.map(function(x){return '<div class="stat"><div class="lbl">'+x[0]+'</div><div class="v '+x[2]+'">'+x[1]+'</div></div>'}).join("");
  h+='<div class="asof">DATA AS OF '+esc(D.date||"—")+'</div>';
  document.getElementById("stats").innerHTML=h;
})();

/* ---------- dismissals ---------- */
var DK="pf_dismissed_v1";
var getDis=function(){try{return JSON.parse(localStorage.getItem(DK)||"[]")}catch(e){return []}};
var worse=function(cur,old,type){
  if(!n(cur)||!n(old))return false;
  if(type==="risk-change")return cur>=old+2;
  if(type==="oversold")return cur<=old-10;
  if(type==="overbought")return cur>=old+10;
  return false;
};
var visibleRecs=function(){
  var dis=getDis(), now=Date.now();
  return R.filter(function(r){
    var m=dis.filter(function(d){return d.ticker===r.ticker&&d.rec_type===r.rec_type})[0];
    if(!m)return true;
    if((now-new Date(m.date).getTime())/864e5>14)return true;
    return worse(r.trigger_value,m.trigger_value,r.rec_type);
  });
};
var dismiss=function(r){
  var d=getDis();
  d.push({ticker:r.ticker,rec_type:r.rec_type,trigger_value:r.trigger_value,date:new Date().toISOString()});
  try{localStorage.setItem(DK,JSON.stringify(d))}catch(e){}
};
var recCard=function(r){
  var d=el(brk('rec sev'+(r.severity||3),
    '<div class="rh"><span class="tk">'+esc(r.ticker)+'</span>'+
    '<span class="chip">'+esc(r.rec_type)+'</span>'+
    (n(r.trigger_value)?'<span class="lbl">trigger '+r.trigger_value+'</span>':'')+
    (r.fundable===false?'<span class="chip" style="border-color:var(--warn);color:var(--warn);background:rgba(251,191,36,.07)">unfunded</span>':'')+
    '<button class="dis">Dismiss</button></div>'+
    '<p>'+esc(r.rationale)+'</p>')).firstChild;
  d.querySelector(".dis").onclick=function(){dismiss(r);d.remove()};
  return d;
};

/* ---------- overview ---------- */
(function(){
  var ov=document.getElementById("ov"), sorted=P.slice().sort(function(a,b){return (b.today_pct||0)-(a.today_pct||0)});
  var g=sorted[0], l=sorted[sorted.length-1];
  var mini=function(t,p){return p?brk('card','<h3>'+t+'</h3><div class="big '+cls(p.today_pct)+'">'+esc(p.ticker)+' '+pct(p.today_pct)+'</div><div class="sub">'+money(p.market_value)+' · '+esc(p.theme||"")+'</div>'):''};

  var recs=visibleRecs().slice().sort(function(a,b){return (a.severity||3)-(b.severity||3)});
  var top=recs[0];
  var topH=top?brk('card','<h3>Top Recommendation</h3><div class="big">'+esc(top.ticker)+'</div><div class="sub">'+esc(top.rec_type)+' · '+esc(top.rationale)+'</div>'):brk('card','<h3>Top Recommendation</h3><div class="sub">None active</div>');

  var html='<div class="grid g3">'+mini("Biggest Gainer",g)+mini("Biggest Loser",l)+topH+'</div>';

  /* theme rings */
  var keys=Object.keys(TH);
  if(keys.length){
    keys.sort(function(a,b){return (TH[b].weight_pct||0)-(TH[a].weight_pct||0)});
    var rings=keys.map(function(k){
      var w=TH[k].weight_pct||0, hot=w>40, r=21, cc=2*Math.PI*r, off=cc*(1-Math.min(w,100)/100);
      var col=hot?"var(--warn)":"var(--cy)";
      return '<div class="ring"><svg width="52" height="52" viewBox="0 0 52 52">'+
        '<circle cx="26" cy="26" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="4"/>'+
        '<circle cx="26" cy="26" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="4" stroke-linecap="butt" '+
        'stroke-dasharray="'+cc.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 26 26)" '+
        'style="filter:drop-shadow(0 0 4px '+(hot?"rgba(251,191,36,.5)":"var(--cy-glow)")+')"/>'+
        '<text x="26" y="30" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="'+col+'">'+w.toFixed(0)+'</text>'+
        '</svg><div class="rt"><b>'+w.toFixed(1)+'%</b><span>'+esc(k).toUpperCase()+'</span>'+
        '<span class="'+cls(TH[k].today_pct)+'">'+pct(TH[k].today_pct)+' today</span></div></div>';
    }).join("");
    var hotT=keys.filter(function(k){return (TH[k].weight_pct||0)>40});
    html+='<div style="height:12px"></div>'+brk('card','<h3>Theme Exposure'+(hotT.length?' — <span class="warn">concentration '+hotT[0]+' '+TH[hotT[0]].weight_pct.toFixed(1)+'%</span>':'')+'</h3><div class="rings">'+rings+'</div>');
  }

  /* equity curve */
  var rows=(H.rows||[]).filter(function(r){return n(r.portfolio_value)});
  var cv;
  if(rows.length<5){
    cv='<div class="empty">BUILDING HISTORY — '+rows.length+' OF 5 DAYS</div>';
  }else{
    var W=1000,Hh=170,pd=14;
    var vs=rows.map(function(r){return r.portfolio_value});
    var mn=Math.min.apply(null,vs), mx=Math.max.apply(null,vs), rg=(mx-mn)||1;
    var X=function(i){return pd+i*(W-2*pd)/(rows.length-1)};
    var Y=function(v){return Hh-pd-((v-mn)/rg)*(Hh-2*pd)};
    var pts=rows.map(function(r,i){return X(i).toFixed(1)+","+Y(r.portfolio_value).toFixed(1)}).join(" ");
    var area="M"+X(0).toFixed(1)+","+(Hh-pd)+" L"+pts.split(" ").join(" L")+" L"+X(rows.length-1).toFixed(1)+","+(Hh-pd)+" Z";
    var gl=rows.length&&vs[vs.length-1]>=vs[0];
    var col=gl?"var(--up)":"var(--down)";
    cv='<svg class="curve" viewBox="0 0 '+W+' '+Hh+'" preserveAspectRatio="none">'+
      '<defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0%" stop-color="'+col+'" stop-opacity=".22"/><stop offset="100%" stop-color="'+col+'" stop-opacity="0"/></linearGradient></defs>'+
      [0,.25,.5,.75,1].map(function(f){var y=pd+f*(Hh-2*pd);return '<line x1="'+pd+'" y1="'+y+'" x2="'+(W-pd)+'" y2="'+y+'" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 5"/>'}).join("")+
      rows.map(function(r,i){return '<line x1="'+X(i).toFixed(1)+'" y1="'+(Hh-pd)+'" x2="'+X(i).toFixed(1)+'" y2="'+(Hh-pd+4)+'" stroke="var(--line-hot)"/>'}).join("")+
      '<path d="'+area+'" fill="url(#ag)"/>'+
      '<polyline points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="2" style="filter:drop-shadow(0 0 5px '+col+')"/>'+
      '<circle cx="'+X(rows.length-1).toFixed(1)+'" cy="'+Y(vs[vs.length-1]).toFixed(1)+'" r="3.5" fill="'+col+'"/>'+
      '</svg>'+
      '<div class="lbl" style="display:flex;justify-content:space-between;margin-top:6px">'+
      '<span>'+esc(rows[0].date)+' · '+money(mn,0)+'</span><span>'+esc(rows[rows.length-1].date)+' · '+money(mx,0)+'</span></div>';
  }
  html+='<div style="height:12px"></div>'+brk('card','<h3>Equity Curve</h3>'+cv);

  /* closed today */
  var ct=D.closed_today||[];
  if(ct.length){
    html+='<div style="height:12px"></div>'+brk('card','<h3>Closed Today</h3>'+ct.map(function(c){
      return '<div class="f" style="margin-bottom:6px"><span class="tkr">'+esc(c.ticker)+'</span> · '+
      esc(c.shares)+' sh @ '+money(c.avg_sale_price)+' · <span class="'+cls(c.realized_pl)+'">'+money(c.realized_pl)+' ('+pct(c.realized_pl_pct)+')</span> · held '+esc(c.holding_period_days)+'d</div>'}).join(""));
  }

  /* all recommendations */
  html+='<div style="height:12px"></div><h3 class="lbl" style="margin:16px 0 9px;color:var(--cy)">Active Recommendations</h3><div id="recs"></div>';
  ov.innerHTML=html;
  var rc=document.getElementById("recs");
  if(!recs.length) rc.innerHTML='<div class="empty">NO ACTIVE RECOMMENDATIONS</div>';
  else recs.forEach(function(r){rc.appendChild(recCard(r))});
})();

/* ---------- positions ---------- */
var sortMode="val";
function renderPos(){
  var po=document.getElementById("po");
  var list=P.slice();
  if(sortMode==="val")list.sort(function(a,b){return (b.market_value||0)-(a.market_value||0)});
  if(sortMode==="pl")list.sort(function(a,b){return (b.unrealized_pl_pct||0)-(a.unrealized_pl_pct||0)});
  if(sortMode==="az")list.sort(function(a,b){return String(a.ticker).localeCompare(String(b.ticker))});

  var h='<div class="sorts">'+
    [["val","$ Value"],["pl","% Gain/Loss"],["az","Alphabetical"]].map(function(s){
      return '<button data-s="'+s[0]+'" class="'+(sortMode===s[0]?"act":"")+'">'+s[1]+'</button>'}).join("")+'</div>';

  if(!list.length) h+='<div class="empty">NO POSITION DATA</div>';

  h+=list.map(function(p){
    var lv=function(o){return o?[o.s1||o.r1,o.s2||o.r2,o.s3||o.r3].filter(n).map(function(x){return "$"+x}).join(" / "):"—"};
    var news=(p.news||[]).map(function(x){
      return '<div class="nw"><div class="nh"><span class="sent '+esc(x.sentiment)+'">'+esc(x.sentiment)+'</span><span class="hl">'+esc(x.headline)+'</span></div><div class="wy">'+esc(x.why_it_matters)+'</div></div>'
    }).join("")||'<div class="wy" style="color:var(--mut)">No meaningful news today.</div>';

    return brk('pos',
      '<div class="ph">'+
        '<div class="id"><b>'+esc(p.ticker)+'</b><span>'+esc(p.theme||"")+'</span></div>'+
        '<div class="meta">'+money(p.current_price)+' vs cost '+money(p.avg_cost_per_share)+
          ' · target '+(n(p.analyst_target)?money(p.analyst_target):"n/a")+
          ' · '+esc(p.shares)+' sh</div>'+
        '<div class="val"><b>'+money(p.market_value)+'</b><span class="'+cls(p.today_pct)+'">'+pct(p.today_pct)+'</span></div>'+
      '</div>'+
      '<div class="pb"><div class="row">'+
        '<div class="f"><b>Support</b><span class="fv">'+lv(p.support)+'</span></div>'+
        '<div class="f"><b>Resistance</b><span class="fv">'+lv(p.resistance)+'</span>'+(p.levels_stale?' <span class="stale">⚠ stale — not used for recs</span>':'')+'</div>'+
        '<div class="f"><b>RSI(14)</b><span class="fv">'+(n(p.rsi)?p.rsi.toFixed(1):"—")+'</span> <span class="lbl">as of '+esc(p.rsi_as_of||"?")+'</span></div>'+
        '<div class="f"><b>Next Earnings</b><span class="fv">'+esc(p.next_earnings||"none scheduled")+'</span>'+(p.earnings_confirmed===false?' <span class="lbl">(est)</span>':'')+'</div>'+
        '<div class="f"><b>Unrealized</b><span class="fv '+cls(p.unrealized_pl)+'">'+money(p.unrealized_pl)+' ('+pct(p.unrealized_pl_pct)+')</span></div>'+
        '<div class="f"><b>Weight</b><span class="fv">'+(n(p.portfolio_weight_pct)?p.portfolio_weight_pct.toFixed(2)+"%":"—")+'</span> <span class="lbl">'+esc(p.account||"")+'</span></div>'+
      '</div>'+
      (p.insider_notes?'<div class="notes"><span class="cap">Insider — best-effort search, not verified SEC filings</span>'+esc(p.insider_notes)+'</div>':'')+
      '<div class="notes"><span class="cap">News</span>'+news+'</div>'+
      '</div>');
  }).join("");

  po.innerHTML=h;
  po.querySelectorAll(".sorts button").forEach(function(b){b.onclick=function(){sortMode=b.dataset.s;renderPos()}});
  po.querySelectorAll(".pos .ph").forEach(function(hd){hd.onclick=function(){hd.parentNode.classList.toggle("open")}});
}
renderPos();

/* ---------- news feed ---------- */
(function(){
  var nw=document.getElementById("nw"), items=[];
  P.forEach(function(p){
    var fl=[];
    if(n(p.rsi)&&!p.levels_stale){if(p.rsi<30)fl.push("oversold "+p.rsi.toFixed(0));if(p.rsi>70)fl.push("overbought "+p.rsi.toFixed(0))}
    if(p.next_earnings){var dd=Math.round((new Date(p.next_earnings)-new Date(D.date||Date.now()))/864e5);if(dd>=0&&dd<=30)fl.push("catalyst in "+dd+"d")}
    (p.news||[]).forEach(function(x){items.push({t:p.ticker,f:fl,x:x})});
  });
  var order={bad:0,neutral:1,good:2};
  items.sort(function(a,b){return (order[a.x.sentiment]||1)-(order[b.x.sentiment]||1)});
  if(!items.length){nw.innerHTML='<div class="empty">NO NEWS ITEMS</div>';return}
  nw.innerHTML=brk('card','<h3>Consolidated Feed</h3>'+items.map(function(i){
    return '<div class="nw"><div class="nh"><span class="tkr">'+esc(i.t)+'</span><span class="sent '+esc(i.x.sentiment)+'">'+esc(i.x.sentiment)+'</span>'+
      i.f.map(function(f){return '<span class="flag">'+esc(f)+'</span>'}).join("")+
      '<span class="hl">'+esc(i.x.headline)+'</span></div><div class="wy">'+esc(i.x.why_it_matters)+'</div></div>'
  }).join(""));
})();

/* ---------- tabs ---------- */
document.querySelectorAll("nav button").forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll("nav button").forEach(function(x){x.classList.remove("act")});
    document.querySelectorAll(".pane").forEach(function(x){x.classList.remove("act")});
    b.classList.add("act");
    document.getElementById(b.dataset.p).classList.add("act");
  };
});
})();
</script>
