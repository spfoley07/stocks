<title>Portfolio Dashboard</title>
<style>
  :root {
    --bg: #f5f6f8;
    --bg-elevated: #ffffff;
    --text: #1a1d23;
    --text-faint: #6b7280;
    --border: #e2e5ea;
    --accent: #2563eb;
    --good: #15803d;
    --good-bg: #dcfce7;
    --bad: #b91c1c;
    --bad-bg: #fee2e2;
    --neutral: #6b7280;
    --neutral-bg: #eef0f3;
    --chip-bg: #eef1f6;
    --shadow: 0 1px 3px rgba(20,20,30,0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --bg-elevated: #1d2026;
      --text: #e7e9ee;
      --text-faint: #9aa1ac;
      --border: #2c3038;
      --accent: #5b8cff;
      --good: #4ade80;
      --good-bg: #123822;
      --bad: #f87171;
      --bad-bg: #3a1414;
      --neutral: #9aa1ac;
      --neutral-bg: #23262d;
      --chip-bg: #23262d;
      --shadow: 0 1px 3px rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161a; --bg-elevated: #1d2026; --text: #e7e9ee; --text-faint: #9aa1ac;
    --border: #2c3038; --accent: #5b8cff; --good: #4ade80; --good-bg: #123822;
    --bad: #f87171; --bad-bg: #3a1414; --neutral: #9aa1ac; --neutral-bg: #23262d;
    --chip-bg: #23262d; --shadow: 0 1px 3px rgba(0,0,0,0.4);
  }
  :root[data-theme="light"] {
    --bg: #f5f6f8; --bg-elevated: #ffffff; --text: #1a1d23; --text-faint: #6b7280;
    --border: #e2e5ea; --accent: #2563eb; --good: #15803d; --good-bg: #dcfce7;
    --bad: #b91c1c; --bad-bg: #fee2e2; --neutral: #6b7280; --neutral-bg: #eef0f3;
    --chip-bg: #eef1f6; --shadow: 0 1px 3px rgba(20,20,30,0.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px; line-height: 1.45; padding-bottom: 48px;
  }
  a { color: var(--accent); }
  .num { font-variant-numeric: tabular-nums; }
  .up { color: var(--good); }
  .down { color: var(--bad); }
  .flat { color: var(--text-faint); }

  #topbar {
    position: sticky; top: 0; z-index: 50;
    background: var(--bg-elevated); border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow);
    padding: 10px 16px;
    display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center;
  }
  #topbar .metric { display: flex; flex-direction: column; min-width: 84px; }
  #topbar .metric .label { font-size: 11px; text-transform: uppercase; letter-spacing: .03em; color: var(--text-faint); }
  #topbar .metric .value { font-size: 17px; font-weight: 600; }
  #topbar .metric .value small { font-weight: 500; font-size: 13px; margin-left: 4px; }
  #topbar .stamp { margin-left: auto; font-size: 12px; color: var(--text-faint); align-self: center; }

  main { max-width: 980px; margin: 0 auto; padding: 16px; }

  nav.tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
  nav.tabs button {
    background: none; border: none; padding: 10px 14px; font-size: 14px; font-weight: 600;
    color: var(--text-faint); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  nav.tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
  section.tab { display: none; }
  section.tab.active { display: block; }

  .card {
    background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 12px;
  }
  .card h2 { font-size: 14px; margin: 0 0 10px; text-transform: uppercase; letter-spacing: .03em; color: var(--text-faint); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } }

  .pill { display: inline-block; padding: 3px 9px; border-radius: 999px; background: var(--chip-bg); font-size: 12.5px; margin: 2px 4px 2px 0; }
  .sentiment-good { background: var(--good-bg); color: var(--good); }
  .sentiment-bad { background: var(--bad-bg); color: var(--bad); }
  .sentiment-neutral { background: var(--neutral-bg); color: var(--neutral); }

  .rec-card { border-left: 4px solid var(--accent); padding: 10px 12px; margin-bottom: 8px; background: var(--bg-elevated); border-radius: 0 8px 8px 0; border-top:1px solid var(--border); border-right:1px solid var(--border); border-bottom:1px solid var(--border); }
  .rec-card .rec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .rec-card .rec-ticker { font-weight: 700; }
  .rec-card .rec-type { font-size: 11px; text-transform: uppercase; color: var(--text-faint); }
  .rec-card .rec-rationale { font-size: 13.5px; margin-top: 4px; }
  .rec-card button.dismiss { margin-top: 6px; font-size: 12px; background: var(--chip-bg); border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; cursor: pointer; color: var(--text); }

  .theme-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 13.5px; }
  .theme-row .bar-track { flex: 1; height: 8px; border-radius: 4px; background: var(--chip-bg); overflow: hidden; }
  .theme-row .bar-fill { height: 100%; background: var(--accent); }
  .theme-row.over .bar-fill { background: var(--bad); }
  .theme-row .theme-name { min-width: 150px; }
  .theme-row .theme-pct { min-width: 54px; text-align: right; }

  .sort-controls { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .sort-controls button { background: var(--chip-bg); border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; font-size: 12.5px; cursor: pointer; color: var(--text); }
  .sort-controls button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .pos-card { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
  .pos-card .pos-summary { padding: 12px 14px; cursor: pointer; display: grid; grid-template-columns: auto 1fr auto auto; gap: 4px 14px; align-items: center; }
  .pos-card .pos-ticker { font-weight: 700; font-size: 15.5px; }
  .pos-card .pos-theme { font-size: 11.5px; color: var(--text-faint); grid-column: 1 / 2; }
  .pos-card .pos-mid { font-size: 12.5px; color: var(--text-faint); }
  .pos-card .pos-value { text-align: right; font-weight: 600; }
  .pos-card .pos-today { text-align: right; font-size: 13px; }
  .pos-card .pos-detail { display: none; padding: 0 14px 14px; font-size: 13px; border-top: 1px solid var(--border); }
  .pos-card.expanded .pos-detail { display: block; padding-top: 10px; }
  .pos-card .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; margin-bottom: 8px; }
  @media (max-width: 480px) { .pos-card .detail-grid { grid-template-columns: 1fr; } }
  .stale-flag { color: var(--bad); font-size: 11.5px; }

  .news-item { border-bottom: 1px solid var(--border); padding: 10px 0; font-size: 13.5px; }
  .news-item:last-child { border-bottom: none; }
  .news-item .news-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .news-item .news-ticker { font-weight: 700; }
  .news-item .news-date { font-size: 11px; color: var(--text-faint); margin-left: auto; }
  .news-item .news-why { color: var(--text-faint); margin-top: 2px; }
  .flag-row { margin-top: 4px; }

  svg.chart text { fill: var(--text-faint); font-size: 10px; }
  .chart-caption { font-size: 12px; color: var(--text-faint); margin-top: 6px; }
  .empty-note { color: var(--text-faint); font-size: 13.5px; padding: 20px 0; text-align: center; }
  .closed-item { font-size: 13.5px; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .closed-item:last-child { border-bottom: none; }
</style>
</head>

<script>
(function () {
  "use strict";

  function esc(s) {
    if (s === null || s === undefined) return "";
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function parseJsonBlock(id) {
    var el = document.getElementById(id);
    if (!el) return {};
    try { return JSON.parse(el.textContent || "{}"); } catch (e) { return {}; }
  }
  function fmtUSD(n, opts) {
    opts = opts || {};
    if (typeof n !== "number" || isNaN(n)) return "—";
    var sign = n < 0 ? "-" : (opts.plus && n > 0 ? "+" : "");
    var abs = Math.abs(n);
    return sign + "$" + abs.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function fmtPct(n, opts) {
    opts = opts || {};
    if (typeof n !== "number" || isNaN(n)) return "—";
    var sign = n < 0 ? "" : (opts.plus !== false ? "+" : "");
    return sign + n.toFixed(2) + "%";
  }
  function signClass(n) {
    if (typeof n !== "number" || isNaN(n)) return "flat";
    return n > 0 ? "up" : (n < 0 ? "down" : "flat");
  }
  function daysAgo(dateStr) {
    var then = new Date(dateStr + "T00:00:00Z").getTime();
    var now = Date.now();
    return Math.floor((now - then) / 86400000);
  }
  function daysUntil(dateStr) {
    if (!dateStr) return null;
    var then = new Date(dateStr + "T00:00:00Z").getTime();
    var now = Date.now();
    return Math.ceil((then - now) / 86400000);
  }

  var daily = parseJsonBlock("daily-data-json");
  var weekly = parseJsonBlock("weekly-cache-json");
  var history = parseJsonBlock("history-json");

  var positions = daily.positions || [];
  var totals = daily.totals || {};
  var cash = daily.cash || {};
  var themes = daily.themes || {};
  var recommendations = daily.recommendations || [];
  var closedToday = daily.closed_today || [];
  var notes = daily.notes || [];

  var DISMISS_KEY = "dashboard_dismissed_recs_v1";
  function loadDismissed() {
    try { return JSON.parse(localStorage.getItem(DISMISS_KEY) || "[]"); } catch (e) { return []; }
  }
  function saveDismissed(list) {
    try { localStorage.setItem(DISMISS_KEY, JSON.stringify(list)); } catch (e) {}
  }
  function recKey(r) { return r.ticker + "|" + r.rec_type; }
  function dismissRec(r) {
    var list = loadDismissed();
    list.push({ ticker: r.ticker, rec_type: r.rec_type, trigger_value: r.trigger_value, date: daily.date });
    saveDismissed(list);
  }
  function isMateriallyWorse(rec, dismissed) {
    if (typeof rec.trigger_value !== "number" || typeof dismissed.trigger_value !== "number") return true;
    if (rec.rec_type === "risk-change") {
      return rec.trigger_value >= dismissed.trigger_value + 2;
    }
    if (rec.rec_type === "oversold") {
      return rec.trigger_value <= dismissed.trigger_value - 10;
    }
    if (rec.rec_type === "overbought") {
      return rec.trigger_value >= dismissed.trigger_value + 10;
    }
    return false;
  }
  function visibleRecommendations() {
    var dismissed = loadDismissed();
    return recommendations.filter(function (r) {
      var match = null;
      for (var i = 0; i < dismissed.length; i++) {
        if (recKey(dismissed[i]) === recKey(r)) { match = dismissed[i]; break; }
      }
      if (!match) return true;
      if (daysAgo(match.date) >= 14) return true;
      return isMateriallyWorse(r, match);
    });
  }

  function renderTopbar() {
    var mover = totals.biggest_mover || {};
    var parts = [];
    parts.push('<div class="metric"><span class="label">Portfolio Value</span><span class="value num">' + fmtUSD(totals.portfolio_value) + '</span></div>');
    parts.push('<div class="metric"><span class="label">Today</span><span class="value num ' + signClass(totals.today_pct) + '">' + fmtPct(totals.today_pct) + '<small>' + fmtUSD(totals.today_dollars, {plus:true}) + '</small></span></div>');
    parts.push('<div class="metric"><span class="label">Total Return</span><span class="value num ' + signClass(totals.total_return) + '">' + fmtUSD(totals.total_return, {plus:true}) + '<small>' + fmtPct(totals.total_return_pct) + '</small></span></div>');
    parts.push('<div class="metric"><span class="label">Unrealized P/L</span><span class="value num ' + signClass(totals.unrealized_pl) + '">' + fmtUSD(totals.unrealized_pl, {plus:true}) + '<small>' + fmtPct(totals.unrealized_pl_pct) + '</small></span></div>');
    if (mover.ticker) {
      parts.push('<div class="metric"><span class="label">Biggest Mover</span><span class="value num ' + signClass(mover.today_pct) + '">' + esc(mover.ticker) + ' ' + fmtPct(mover.today_pct) + '</span></div>');
    }
    if (cash.display) {
      parts.push('<div class="metric"><span class="label">Cash</span><span class="value num">' + fmtUSD(cash.total) + '</span></div>');
    }
    parts.push('<div class="stamp">Data as of ' + esc(daily.date || "—") + '</div>');
    document.getElementById("topbar").innerHTML = parts.join("");
  }

  function renderEquityCurve() {
    var rows = (history.rows || []).slice();
    if (rows.length < 5) {
      return '<div class="empty-note">building history — ' + rows.length + ' of 5 days</div>';
    }
    var W = 640, H = 200, pad = 28;
    var vals = rows.map(function (r) { return r.portfolio_value; });
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    if (min === max) { min -= 1; max += 1; }
    function x(i) { return pad + (i / (rows.length - 1)) * (W - pad * 2); }
    function y(v) { return H - pad - ((v - min) / (max - min)) * (H - pad * 2); }
    var path = rows.map(function (r, i) { return (i === 0 ? "M" : "L") + x(i).toFixed(1) + "," + y(r.portfolio_value).toFixed(1); }).join(" ");
    var last = vals[vals.length - 1];
    var svg = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Portfolio value over time">' +
      '<line x1="' + pad + '" y1="' + (H - pad) + '" x2="' + (W - pad) + '" y2="' + (H - pad) + '" stroke="var(--border)" stroke-width="1" />' +
      '<path d="' + path + '" fill="none" stroke="var(--accent)" stroke-width="2.5" />' +
      '<text x="' + pad + '" y="14">' + esc(fmtUSD(max)) + '</text>' +
      '<text x="' + pad + '" y="' + (H - pad + 16) + '">' + esc(fmtUSD(min)) + '</text>' +
      '<text x="' + (W - pad) + '" y="14" text-anchor="end">' + esc(rows[rows.length-1].date) + '</text>' +
      '<text x="' + pad + '" y="' + (H - pad + 30) + '">' + esc(rows[0].date) + '</text>' +
      '</svg>';
    return svg + '<div class="chart-caption">Portfolio value over time, from ' + esc(rows[0].date) + ' (tracking start) through ' + esc(rows[rows.length-1].date) + '. Latest: ' + esc(fmtUSD(last)) + '.</div>';
  }

  function renderOverview() {
    var sorted = positions.slice().sort(function (a, b) { return (b.today_pct || 0) - (a.today_pct || 0); });
    var gainer = sorted[0], loser = sorted[sorted.length - 1];
    var visRecs = visibleRecommendations().slice().sort(function (a, b) { return (a.severity||9) - (b.severity||9); });
    var topRec = visRecs[0];
    var riskChanges = visRecs.filter(function (r) { return r.rec_type === "risk-change"; });

    var html = "";

    html += '<div class="card"><h2>Movers &amp; Top Signal</h2><div class="grid2">';
    html += '<div><div class="label" style="font-size:11px;color:var(--text-faint);text-transform:uppercase;">Biggest Gainer</div>' +
      (gainer ? '<div class="num up" style="font-size:16px;font-weight:600;">' + esc(gainer.ticker) + ' ' + fmtPct(gainer.today_pct) + '</div>' : '<div class="empty-note">none</div>') + '</div>';
    html += '<div><div class="label" style="font-size:11px;color:var(--text-faint);text-transform:uppercase;">Biggest Loser</div>' +
      (loser ? '<div class="num down" style="font-size:16px;font-weight:600;">' + esc(loser.ticker) + ' ' + fmtPct(loser.today_pct) + '</div>' : '<div class="empty-note">none</div>') + '</div>';
    html += '</div>';
    if (topRec) {
      html += '<div style="margin-top:10px;"><div class="label" style="font-size:11px;color:var(--text-faint);text-transform:uppercase;">Top Recommendation</div>' +
        '<div style="font-size:13.5px;margin-top:2px;"><b>' + esc(topRec.ticker) + '</b> — ' + esc(topRec.rationale) + '</div></div>';
    }
    if (riskChanges.length) {
      html += '<div style="margin-top:10px;"><div class="label" style="font-size:11px;color:var(--text-faint);text-transform:uppercase;">Risk Profile Change</div>';
      riskChanges.forEach(function (r) {
        html += '<div style="font-size:13.5px;margin-top:2px;"><b>' + esc(r.ticker) + '</b> at ' + esc(String(r.trigger_value)) + '% — ' + esc(r.rationale) + '</div>';
      });
      html += '</div>';
    }
    html += '</div>';

    html += '<div class="card"><h2>Theme Exposure</h2>';
    var themeKeys = Object.keys(themes).sort(function (a, b) { return themes[b].weight_pct - themes[a].weight_pct; });
    if (!themeKeys.length) {
      html += '<div class="empty-note">no theme data</div>';
    } else {
      themeKeys.forEach(function (k) {
        var t = themes[k];
        var over = t.weight_pct > 40;
        html += '<div class="theme-row' + (over ? ' over' : '') + '">' +
          '<span class="theme-name">' + (over ? '&#9888; ' : '') + esc(k) + '</span>' +
          '<span class="bar-track"><span class="bar-fill" style="width:' + Math.min(100, t.weight_pct) + '%"></span></span>' +
          '<span class="theme-pct num">' + t.weight_pct.toFixed(1) + '%</span>' +
          '<span class="theme-pct num ' + signClass(t.today_pct) + '" style="min-width:60px;">' + fmtPct(t.today_pct) + '</span>' +
          '</div>';
      });
    }
    html += '</div>';

    html += '<div class="card"><h2>Equity Curve</h2>' + renderEquityCurve() + '</div>';

    var recentClosed = closedToday.length ? closedToday.map(function (c) { return Object.assign({}, c, { closedDate: daily.date }); }) : [];
    if (recentClosed.length) {
      html += '<div class="card"><h2>Closed Positions (last 7 days)</h2>';
      recentClosed.forEach(function (c) {
        html += '<div class="closed-item"><b>' + esc(c.ticker) + '</b> — ' + esc(String(c.shares)) + ' sh @ avg ' + fmtUSD(c.avg_sale_price) +
          ' — realized <span class="num ' + signClass(c.realized_pl) + '">' + fmtUSD(c.realized_pl, {plus:true}) + ' (' + fmtPct(c.realized_pl_pct) + ')</span>' +
          ' — held ' + esc(String(c.holding_period_days)) + ' days <span style="color:var(--text-faint);">(closed ' + esc(c.closedDate) + ')</span></div>';
      });
      html += '</div>';
    }

    html += '<div class="card"><h2>Recommendations</h2><div id="rec-list"></div></div>';

    if (notes.length) {
      html += '<div class="card"><h2>Notes</h2><ul style="margin:0;padding-left:18px;font-size:13px;color:var(--text-faint);">' +
        notes.map(function (n) { return '<li style="margin-bottom:4px;">' + esc(n) + '</li>'; }).join("") + '</ul></div>';
    }

    document.getElementById("tab-overview").innerHTML = html;
    renderRecList(document.getElementById("rec-list"));
  }

  function renderRecList(container) {
    var visRecs = visibleRecommendations().slice().sort(function (a, b) { return (a.severity||9) - (b.severity||9); });
    if (!visRecs.length) {
      container.innerHTML = '<div class="empty-note">no active recommendations</div>';
      return;
    }
    container.innerHTML = "";
    visRecs.forEach(function (r) {
      var div = document.createElement("div");
      div.className = "rec-card";
      var fundable = "";
      if (r.rec_type === "add-consideration" && typeof r.fundable === "boolean") {
        fundable = ' <span class="pill">' + (r.fundable ? "fundable" : "not fundable") + '</span>';
      }
      div.innerHTML = '<div class="rec-head"><span class="rec-ticker">' + esc(r.ticker) + '</span><span class="rec-type">' + esc(r.rec_type) + ' · sev ' + esc(String(r.severity)) + '</span></div>' +
        '<div class="rec-rationale">' + esc(r.rationale) + fundable + '</div>';
      var btn = document.createElement("button");
      btn.className = "dismiss";
      btn.textContent = "Dismiss";
      btn.addEventListener("click", function () {
        dismissRec(r);
        renderRecList(container);
      });
      div.appendChild(btn);
      container.appendChild(div);
    });
  }

  var currentSort = "value";
  function sortPositions(list) {
    var arr = list.slice();
    if (currentSort === "value") arr.sort(function (a, b) { return (b.market_value||0) - (a.market_value||0); });
    else if (currentSort === "gain") arr.sort(function (a, b) { return (b.unrealized_pl_pct||0) - (a.unrealized_pl_pct||0); });
    else if (currentSort === "alpha") arr.sort(function (a, b) { return a.ticker.localeCompare(b.ticker); });
    return arr;
  }
  function renderPositions() {
    var html = '<div class="sort-controls">' +
      '<button data-sort="value" class="active">$ Value</button>' +
      '<button data-sort="gain">% Gain/Loss</button>' +
      '<button data-sort="alpha">Alphabetical</button>' +
      '</div><div id="pos-list"></div>';
    document.getElementById("tab-positions").innerHTML = html;
    renderPosList();
    var btns = document.querySelectorAll(".sort-controls button");
    btns.forEach(function (b) {
      b.addEventListener("click", function () {
        currentSort = b.getAttribute("data-sort");
        btns.forEach(function (x) { x.classList.remove("active"); });
        b.classList.add("active");
        renderPosList();
      });
    });
  }
  function renderPosList() {
    var container = document.getElementById("pos-list");
    var list = sortPositions(positions);
    container.innerHTML = "";
    list.forEach(function (p) {
      var card = document.createElement("div");
      card.className = "pos-card";
      var newsHtml = (p.news || []).length ? (p.news || []).map(function (n) {
        return '<div class="news-item"><span class="pill sentiment-' + esc(n.sentiment) + '">' + esc(n.sentiment) + '</span> ' +
          '<b>' + esc(n.headline) + '</b><div class="news-why">' + esc(n.why_it_matters) + '</div></div>';
      }).join("") : '<div class="empty-note">no news</div>';
      var earn = p.next_earnings ? esc(p.next_earnings) + (p.earnings_confirmed ? "" : " (estimated)") : "none scheduled";
      var rsiStr = (typeof p.rsi === "number" ? p.rsi.toFixed(1) : "—") + (p.rsi_as_of ? ' <span style="color:var(--text-faint);">(as of ' + esc(p.rsi_as_of) + ')</span>' : "");
      var srStale = p.levels_stale ? ' <span class="stale-flag">&#9888; stale — price has moved through these levels; not used for recommendations</span>' : "";
      card.innerHTML =
        '<div class="pos-summary">' +
          '<div><div class="pos-ticker">' + esc(p.ticker) + '</div><div class="pos-theme">' + esc(p.theme) + '</div></div>' +
          '<div class="pos-mid">' + fmtUSD(p.current_price) + ' vs cost ' + fmtUSD(p.avg_cost_per_share) + ' &middot; target ' + (typeof p.analyst_target === "number" ? fmtUSD(p.analyst_target) : esc(String(p.analyst_target))) + ' &middot; ' + esc(String(p.shares)) + ' sh</div>' +
          '<div class="pos-value num">' + fmtUSD(p.market_value) + '</div>' +
          '<div class="pos-today num ' + signClass(p.today_pct) + '">' + fmtPct(p.today_pct) + '</div>' +
        '</div>' +
        '<div class="pos-detail"><div class="detail-grid">' +
          '<div><b>Support</b>: ' + (p.support ? fmtUSD(p.support.s1) + ' / ' + fmtUSD(p.support.s2) + ' / ' + fmtUSD(p.support.s3) : "—") + '</div>' +
          '<div><b>Resistance</b>: ' + (p.resistance ? fmtUSD(p.resistance.r1) + ' / ' + fmtUSD(p.resistance.r2) + ' / ' + fmtUSD(p.resistance.r3) : "—") + srStale + '</div>' +
          '<div><b>RSI(14)</b>: ' + rsiStr + '</div>' +
          '<div><b>Next earnings</b>: ' + earn + '</div>' +
          '<div><b>Unrealized P/L</b>: <span class="num ' + signClass(p.unrealized_pl) + '">' + fmtUSD(p.unrealized_pl, {plus:true}) + ' (' + fmtPct(p.unrealized_pl_pct) + ')</span></div>' +
          '<div><b>Portfolio weight</b>: ' + (typeof p.portfolio_weight_pct === "number" ? p.portfolio_weight_pct.toFixed(2) + "%" : "—") + '</div>' +
          '<div><b>Analyst source</b>: ' + esc(p.analyst_target_source) + (typeof p.analyst_count === "number" ? " (" + p.analyst_count + " analysts)" : "") + '</div>' +
          '<div><b>Account</b>: ' + esc(p.account) + '</div>' +
        '</div>' +
        '<div style="margin-bottom:8px;"><b>Insider notes</b> <span style="color:var(--text-faint);font-size:11.5px;">(best-effort search, not verified SEC filings)</span><div style="margin-top:2px;">' + esc(p.insider_notes) + '</div></div>' +
        '<div><b>News</b>' + newsHtml + '</div>' +
        '</div>';
      card.querySelector(".pos-summary").addEventListener("click", function () {
        card.classList.toggle("expanded");
      });
      container.appendChild(card);
    });
  }

  function renderWatchlist() {
    var items = [];
    positions.forEach(function (p) {
      (p.news || []).forEach(function (n) {
        items.push({ ticker: p.ticker, headline: n.headline, why: n.why_it_matters, sentiment: n.sentiment, date: daily.date });
      });
    });
    var flags = [];
    positions.forEach(function (p) {
      if (typeof p.rsi === "number") {
        if (p.rsi < 30) flags.push(esc(p.ticker) + " oversold (RSI " + p.rsi.toFixed(1) + ")");
        else if (p.rsi > 70) flags.push(esc(p.ticker) + " overbought (RSI " + p.rsi.toFixed(1) + ")");
      }
      var du = daysUntil(p.next_earnings);
      if (du !== null && du >= 0 && du <= 30) {
        flags.push(esc(p.ticker) + " earnings in " + du + "d (" + esc(p.next_earnings) + (p.earnings_confirmed ? "" : ", estimated") + ")");
      }
    });
    var riskRecs = recommendations.filter(function (r) { return r.rec_type === "risk-change"; });

    var html = "";
    if (flags.length) {
      html += '<div class="card"><h2>Flags</h2>' + flags.map(function (f) { return '<span class="pill">' + f + '</span>'; }).join(" ") + '</div>';
    }
    if (riskRecs.length) {
      html += '<div class="card"><h2>Risk Profile Changes</h2>' + riskRecs.map(function (r) {
        return '<div class="news-item"><b>' + esc(r.ticker) + '</b><div class="news-why">' + esc(r.rationale) + '</div></div>';
      }).join("") + '</div>';
    }
    html += '<div class="card"><h2>News Feed <span style="font-weight:400;text-transform:none;color:var(--text-faint);font-size:12px;">(insider mentions are best-effort search, not verified SEC filings)</span></h2>';
    if (!items.length) {
      html += '<div class="empty-note">no news today</div>';
    } else {
      items.forEach(function (it) {
        html += '<div class="news-item"><div class="news-head"><span class="news-ticker">' + esc(it.ticker) + '</span>' +
          '<span class="pill sentiment-' + esc(it.sentiment) + '">' + esc(it.sentiment) + '</span>' +
          '<span class="news-date">' + esc(it.date) + '</span></div>' +
          '<div>' + esc(it.headline) + '</div>' +
          '<div class="news-why">' + esc(it.why) + '</div></div>';
      });
    }
    html += '</div>';
    document.getElementById("tab-watchlist").innerHTML = html;
  }

  function initTabs() {
    var btns = document.querySelectorAll("nav.tabs button");
    btns.forEach(function (b) {
      b.addEventListener("click", function () {
        btns.forEach(function (x) { x.classList.remove("active"); });
        b.classList.add("active");
        document.querySelectorAll("section.tab").forEach(function (s) { s.classList.remove("active"); });
        document.getElementById("tab-" + b.getAttribute("data-tab")).classList.add("active");
      });
    });
  }

  renderTopbar();
  renderOverview();
  renderPositions();
