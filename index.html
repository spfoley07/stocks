  }

    --surface: #161a21;
    --surface-2: #1d222b;

    --text-dim: #9aa4b2;
    --text-faint: #6b7482;
    --accent: #7d9bd4;
    --accent-soft: #1c2740;
    --good: #4cd0a0;
    --good-soft: #123128;
    --bad: #f2697c;
    --bad-soft: #3a1620;
    --warn: #d9a860;
    --warn-soft: #362a12;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 18px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #faf9f7;
    --surface: #ffffff;
    --surface-2: #f5f4f1;
    --border: #ececec;
    --text: #1a1a1a;
    --text-dim: #6b6b6b;
    --text-faint: #9a9a94;
    --accent: #4c6fa5;
    --accent-soft: #ebf1f8;
    --good: #2e7d5b;
    --good-soft: #e7f4ee;
    --bad: #c0392b;
    --bad-soft: #fbeae7;
    --warn: #a8752e;
    --warn-soft: #faf1de;
    --shadow: 0 1px 2px rgba(20, 20, 20, 0.04), 0 6px 16px rgba(20, 20, 20, 0.05);
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
  }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, ui-sans-serif, system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .num, .mono, td.num, .price, .pct, .dollar {
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
  }
  h1, h2, h3 { text-wrap: balance; margin: 0; }
  a { color: var(--accent); }
  button { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  /* ---------- Sticky top bar ---------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 2px 10px rgba(20, 20, 20, 0.04);
  }
  .topbar-inner {
    max-width: 1080px;
    margin: 0 auto;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 32px;
    flex-wrap: wrap;
  }
  .topbar-brand {
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.01em;
    color: var(--text);
    white-space: nowrap;
    margin-right: 4px;
  }
  .topbar-metric { display: flex; flex-direction: column; gap: 3px; }
  .topbar-metric .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-faint);
  }
  .topbar-metric .value { font-size: 19px; font-weight: 600; letter-spacing: -0.01em; }
  .topbar-date { margin-left: auto; font-size: 12.5px; color: var(--text-faint); white-space: nowrap; }

  .good { color: var(--good); }
  .bad { color: var(--bad); }
  .neutral { color: var(--text-dim); }

  /* ---------- Tabs ---------- */
  .tabs {
    max-width: 1080px;
    margin: 0 auto;
    display: flex;
    gap: 4px;
    padding: 12px 24px 10px;
  }
  .tab-btn {
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 14px;
    font-weight: 600;
    padding: 9px 16px;
    cursor: pointer;
    border-radius: var(--radius-sm);
    transition: background 0.15s ease, color 0.15s ease;
  }
  .tab-btn:hover { background: var(--surface-2); color: var(--text); }
  .tab-btn.active { color: var(--accent); background: var(--accent-soft); }

  main { max-width: 1080px; margin: 0 auto; padding: 24px; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .section-title {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-faint);
    margin: 30px 0 14px;
  }
  .section-title:first-child { margin-top: 0; }

  /* ---------- Cards ---------- */
  .card {
    background: var(--surface);
    border: none;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .grid-4 {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
  }
  .stat-card { padding: 18px; display: flex; flex-direction: column; gap: 6px; }
  .stat-card .label { font-size: 12px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.05em; }
  .stat-card .big { font-size: 22px; font-weight: 700; }
  .stat-card .sub { font-size: 13px; color: var(--text-dim); }

  .empty-state {
    padding: 32px 20px;
    text-align: center;
    color: var(--text-faint);
    font-size: 14px;
    border: 1px dashed var(--border);
    border-radius: var(--radius);
  }

  /* ---------- Positions ---------- */
  .positions-toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .positions-toolbar .label { font-size: 12.5px; color: var(--text-faint); }
  .sort-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 13px;
    color: var(--text-dim);
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .sort-btn.active { color: var(--accent); border-color: var(--accent-soft); background: var(--accent-soft); font-weight: 600; }

  .position-list { display: flex; flex-direction: column; gap: 10px; }
  .position-card { padding: 0; overflow: hidden; }
  .position-head {
    display: grid;
    grid-template-columns: 84px 1fr 1fr auto auto auto;
    align-items: center;
    gap: 14px;
    padding: 15px 18px;
    cursor: pointer;
    background: none;
    border: none;
    width: 100%;
    text-align: left;
    color: var(--text);
    min-height: 44px;
  }
  .position-head:hover { background: var(--surface-2); }
  .pos-ticker { font-weight: 700; font-size: 15px; letter-spacing: 0.01em; }
  .pos-price-block { display: flex; flex-direction: column; gap: 2px; }
  .pos-price-block .cur { font-size: 14px; font-weight: 600; }
  .pos-price-block .cost { font-size: 12px; color: var(--text-faint); }
  .pos-target-block { display: flex; flex-direction: column; gap: 2px; }
  .pos-target-block .lbl { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); }
  .pos-target-block .val { font-size: 13px; color: var(--text-dim); }
  .pos-mv-block { display: flex; flex-direction: column; gap: 2px; text-align: right; }
  .pos-mv-block .mv { font-size: 14px; font-weight: 600; }
  .pos-mv-block .shares { font-size: 12px; color: var(--text-faint); }
  .pos-chip {
    font-size: 13px;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: var(--radius-sm);
    white-space: nowrap;
    min-width: 66px;
    text-align: center;
  }
  .pos-chip.good { background: var(--good-soft); color: var(--good); }
  .pos-chip.bad { background: var(--bad-soft); color: var(--bad); }
  .chevron { color: var(--text-faint); transition: transform 0.15s ease; font-size: 12px; }
  .position-card.open .chevron { transform: rotate(90deg); }

  .position-detail {
    display: none;
    padding: 4px 18px 18px;
    border-top: 1px solid var(--border);
  }
  .position-card.open .position-detail { display: block; }
  .detail-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
    margin: 14px 0;
  }
  .detail-item { background: var(--surface-2); border-radius: var(--radius-sm); padding: 11px 13px; }
  .detail-item .lbl { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); margin-bottom: 3px; }
  .detail-item .val { font-size: 14px; font-weight: 600; }
  .detail-item .val-sub { font-size: 11px; font-weight: 400; color: var(--text-faint); margin-top: 2px; }
  .detail-flag { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-left: 6px; }
  .detail-flag.warn { background: var(--warn-soft); color: var(--warn); }
  .news-list { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
  .news-list li { font-size: 13px; color: var(--text-dim); padding-left: 14px; position: relative; line-height: 1.5; }
  .news-list li::before { content: "\25CF"; position: absolute; left: 0; top: 1px; font-size: 9px; color: var(--text-faint); }
  .news-list li.sentiment-good::before { color: var(--good); }
  .news-list li.sentiment-bad::before { color: var(--bad); }
  .news-list li.sentiment-neutral::before { color: var(--text-faint); }
  .news-headline { display: block; font-weight: 600; color: var(--text); }
  .news-list li.sentiment-good .news-headline { color: var(--good); }
  .news-list li.sentiment-bad .news-headline { color: var(--bad); }
  .news-list li.sentiment-neutral .news-headline { color: var(--text); }
  .news-why { display: block; font-size: 11.5px; font-weight: 400; color: var(--text-faint); margin-top: 2px; }
  .no-news { font-size: 13px; color: var(--text-faint); font-style: italic; }

  /* ---------- Watchlist / news feed ---------- */
  .feed-item {
    display: flex;
    gap: 16px;
    padding: 16px 18px;
    margin-bottom: 10px;
  }
  .feed-ticker-col { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 58px; }
  .feed-ticker-col .t { font-weight: 700; font-size: 14px; }
  .feed-body { flex: 1; min-width: 0; }
  .feed-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .tag {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 3px 9px;
    border-radius: 999px;
  }
  .tag.oversold { background: var(--good-soft); color: var(--good); }
  .tag.overbought { background: var(--bad-soft); color: var(--bad); }
  .tag.catalyst { background: var(--accent-soft); color: var(--accent); }
  .tag.insider { background: var(--warn-soft); color: var(--warn); }
  .tag.risk { background: var(--warn-soft); color: var(--warn); }
  .feed-body ul { margin: 0; padding-left: 16px; font-size: 13.5px; color: var(--text-dim); line-height: 1.55; }
  .feed-body li { margin-bottom: 4px; }
  .feed-meta { font-size: 11.5px; color: var(--text-faint); margin-top: 8px; }

  /* ---------- Recommendation / overview cards ---------- */
  .rec-card {
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 10px;
    border-left: 3px solid var(--warn);
    border-radius: 4px var(--radius) var(--radius) 4px;
  }
  .rec-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .rec-ticker-type { display: flex; align-items: center; gap: 8px; }
  .rec-ticker-type .t { font-weight: 700; font-size: 14.5px; }
  .rec-rationale { font-size: 13.5px; color: var(--text-dim); line-height: 1.55; }
  .rec-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .trigger-val { font-size: 12px; color: var(--text-faint); }
  .dismiss-btn {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: var(--radius-sm);
    padding: 7px 13px;
    font-size: 12.5px;
    cursor: pointer;
    min-height: 32px;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .dismiss-btn:hover { background: var(--bad-soft); color: var(--bad); border-color: var(--bad-soft); }

  .overview-highlight { padding: 18px; display: flex; flex-direction: column; gap: 5px; }
  .overview-highlight .kicker { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-faint); }
  .overview-highlight .name { font-size: 17px; font-weight: 700; }
  .overview-highlight .detail { font-size: 13px; color: var(--text-dim); line-height: 1.5; }

  footer.notes {
    margin-top: 34px;
    padding: 16px 18px;
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    font-size: 12.5px;
    color: var(--text-faint);
  }
  footer.notes ul { margin: 8px 0 0; padding-left: 18px; }
  footer.notes li { margin-bottom: 5px; }

  @media (max-width: 620px) {
    main { padding: 16px; }
    .topbar-inner { padding: 14px 16px; gap: 20px 28px; }
    .tabs { padding: 10px 16px 8px; }
    .position-head { grid-template-columns: 60px 1fr auto; padding: 14px 16px; gap: 10px; }
    .pos-target-block { display: none; }
    .pos-mv-block { grid-column: 3; }
    .sort-btn { padding: 8px 14px; }
    .dismiss-btn { padding: 8px 14px; min-height: 36px; }
    .feed-item { padding: 14px; gap: 12px; }
  }
</style>

  }

  var daily = parseJSONBlock("daily-data-json") || {};
  var weekly = parseJSONBlock("weekly-cache-json") || {};
  var positions = daily.positions || [];
  var totals = daily.totals || {};
  var recommendations = daily.recommendations || [];
  var notes = daily.notes || [];

  var DISMISS_KEY = "portfolio_dismissals_v1";
  var DISMISS_WINDOW_DAYS = 14;

  function loadDismissals() {
    try {
      var raw = localStorage.getItem(DISMISS_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }
  function saveDismissals(list) {
    try { localStorage.setItem(DISMISS_KEY, JSON.stringify(list)); } catch (e) {}
  }
  function dismissKey(rec) { return rec.ticker + "::" + rec.rec_type; }

  function isMateriallyWorse(prevTrigger, curTrigger, recType) {
    if (typeof prevTrigger !== "number" || typeof curTrigger !== "number") return false;
    if (recType === "oversold" || recType === "overbought") {
      return Math.abs(curTrigger - prevTrigger) >= 10;
    }
    if (recType === "trim") {
      return curTrigger - prevTrigger >= 2;
    }
    return Math.abs(curTrigger - prevTrigger) >= 2;
  }

  function shouldShowRec(rec) {
    var dismissals = loadDismissals();
    var key = dismissKey(rec);
    var match = null;
    for (var i = 0; i < dismissals.length; i++) {
      if (dismissals[i].ticker === rec.ticker && dismissals[i].rec_type === rec.rec_type) { match = dismissals[i]; break; }
    }
    if (!match) return true;
    var dismissedAt = new Date(match.date).getTime();
    var now = new Date(daily.date || match.date).getTime();
    var ageDays = (now - dismissedAt) / 86400000;
    if (isNaN(ageDays) || ageDays > DISMISS_WINDOW_DAYS) return true;
    return isMateriallyWorse(match.trigger_value, rec.trigger_value, rec.rec_type);
  }

  function dismissRec(rec, btnEl) {
    var dismissals = loadDismissals().filter(function (d) {
      return !(d.ticker === rec.ticker && d.rec_type === rec.rec_type);
    });
    dismissals.push({ ticker: rec.ticker, rec_type: rec.rec_type, trigger_value: rec.trigger_value, date: daily.date || new Date().toISOString().slice(0, 10) });
    saveDismissals(dismissals);
    var card = btnEl.closest(".rec-card");
    if (card) card.remove();
  }

  function fmtUSD(n, opts) {
    if (typeof n !== "number" || isNaN(n)) return "—";
    opts = opts || {};
    var sign = n > 0 ? "+" : n < 0 ? "−" : "";
    var abs = Math.abs(n);
    var s = abs.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return (opts.noSign ? "" : sign) + "$" + s;
  }
  function fmtPct(n) {
    if (typeof n !== "number" || isNaN(n)) return "—";
    var sign = n > 0 ? "+" : n < 0 ? "−" : "";
    return sign + Math.abs(n).toFixed(2) + "%";
  }
  function signClass(n) {
    if (typeof n !== "number" || isNaN(n)) return "neutral";
    return n > 0 ? "good" : n < 0 ? "bad" : "neutral";
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function fmtLevels(levels, keys) {
    if (!levels || typeof levels !== "object") return { main: "—", sub: "" };
    var vals = keys.map(function (k) { return levels[k]; }).filter(function (v) { return typeof v === "number"; });
    if (!vals.length) return { main: "—", sub: "" };
    var main = fmtUSD(vals[0], { noSign: true });
    var sub = vals.slice(1).map(function (v) { return fmtUSD(v, { noSign: true }); }).join(" / ");
    return { main: main, sub: sub };
  }
  function renderNewsItem(n) {
    if (n && typeof n === "object") {
      var sentiment = n.sentiment === "good" || n.sentiment === "bad" ? n.sentiment : "neutral";
      var why = esc(n.why_it_matters || "");
      return '<li class="sentiment-' + sentiment + '">' +
        '<span class="news-headline">' + esc(n.headline || "") + '</span>' +
        (why ? '<span class="news-why">' + why + '</span>' : "") +
        "</li>";
    }
    return '<li class="sentiment-neutral"><span class="news-headline">' + esc(n) + '</span></li>';
  }

  // ---------- Top bar ----------
  document.getElementById("bar-value").textContent = fmtUSD(totals.portfolio_value, { noSign: true });
  var todayEl = document.getElementById("bar-today");
  todayEl.textContent = fmtUSD(totals.today_dollars) + "  (" + fmtPct(totals.today_pct) + ")";
  todayEl.className = "value num " + signClass(totals.today_dollars);
  var plEl = document.getElementById("bar-pl");
  plEl.textContent = fmtUSD(totals.unrealized_pl) + (typeof totals.unrealized_pl_pct === "number" ? "  (" + fmtPct(totals.unrealized_pl_pct) + ")" : "");
  plEl.className = "value num " + signClass(totals.unrealized_pl);
  var moverEl = document.getElementById("bar-mover");
  if (totals.biggest_mover && totals.biggest_mover.ticker) {
    moverEl.textContent = totals.biggest_mover.ticker + "  " + fmtPct(totals.biggest_mover.today_pct);
    moverEl.className = "value num " + signClass(totals.biggest_mover.today_pct);
  } else {
    moverEl.textContent = "—";
  }
  document.getElementById("bar-date").textContent = daily.date ? "As of " + daily.date : "";

  // ---------- Tabs ----------
  var tabBtns = document.querySelectorAll(".tab-btn");
  var panels = { overview: document.getElementById("tab-overview"), positions: document.getElementById("tab-positions"), watchlist: document.getElementById("tab-watchlist") };
  tabBtns.forEach(function (btn) {
    btn.addEventListener("click", function () {
      tabBtns.forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      Object.keys(panels).forEach(function (k) { panels[k].classList.remove("active"); });
      panels[btn.dataset.tab].classList.add("active");
    });
  });

  // ---------- Recommendation card renderer ----------
  var REC_LABELS = {
    trim: "Trim", "add-consideration": "Add consideration", overbought: "Overbought",
    oversold: "Oversold", "binary-catalyst": "Binary catalyst", "risk-change": "Risk change"
  };
  function triggerLabel(rec) {
    if (typeof rec.trigger_value !== "number") return "";
    if (rec.rec_type === "trim") return "Position: " + rec.trigger_value.toFixed(1) + "% of portfolio";
    if (rec.rec_type === "oversold" || rec.rec_type === "overbought") return "RSI " + rec.trigger_value.toFixed(1);
    if (rec.rec_type === "binary-catalyst") return rec.trigger_value + " day(s) to catalyst";
    return "Trigger: " + rec.trigger_value;
  }
  function renderRecCard(rec) {
    var div = document.createElement("div");
    div.className = "card rec-card";
    div.innerHTML =
      '<div class="rec-top">' +
        '<div class="rec-ticker-type"><span class="t">' + esc(rec.ticker) + '</span>' +
        '<span class="tag ' + (rec.rec_type === "oversold" ? "oversold" : rec.rec_type === "overbought" ? "overbought" : rec.rec_type === "binary-catalyst" ? "catalyst" : "risk") + '">' + esc(REC_LABELS[rec.rec_type] || rec.rec_type) + "</span></div>" +
      "</div>" +
      '<div class="rec-rationale">' + esc(rec.rationale) + "</div>" +
      '<div class="rec-foot"><span class="trigger-val num">' + esc(triggerLabel(rec)) + '</span>' +
      '<button class="dismiss-btn" type="button">Dismiss</button></div>';
    div.querySelector(".dismiss-btn").addEventListener("click", function () { dismissRec(rec, this); });
    return div;
  }

  // ---------- Overview tab ----------
  (function buildOverview() {
    var el = panels.overview;
    var frag = document.createDocumentFragment();

    var sorted = positions.slice().sort(function (a, b) { return (a.today_pct || 0) - (b.today_pct || 0); });
    var loser = sorted[0], gainer = sorted[sorted.length - 1];

    var t1 = document.createElement("div");
    t1.className = "section-title";
    t1.textContent = "Snapshot";
    frag.appendChild(t1);

    var grid = document.createElement("div");
    grid.className = "grid-4";
    function hi(kicker, name, detail, cls) {
      var c = document.createElement("div");
      c.className = "card overview-highlight";
      c.innerHTML = '<span class="kicker">' + esc(kicker) + '</span><span class="name ' + (cls || "") + '">' + esc(name) + '</span><span class="detail">' + esc(detail) + "</span>";
      return c;
    }
    if (gainer) grid.appendChild(hi("Biggest gainer", gainer.ticker, fmtPct(gainer.today_pct) + " today · " + fmtUSD(gainer.market_value, { noSign: true }) + " value", signClass(gainer.today_pct)));
    if (loser) grid.appendChild(hi("Biggest loser", loser.ticker, fmtPct(loser.today_pct) + " today · " + fmtUSD(loser.market_value, { noSign: true }) + " value", signClass(loser.today_pct)));
    if (recommendations[0]) grid.appendChild(hi("Top recommendation", recommendations[0].ticker + " · " + (REC_LABELS[recommendations[0].rec_type] || recommendations[0].rec_type), recommendations[0].rationale, ""));
    var riskChange = recommendations.filter(function (r) { return r.rec_type === "risk-change"; })[0];
    if (riskChange) grid.appendChild(hi("Risk-profile change", riskChange.ticker, riskChange.rationale, ""));
    frag.appendChild(grid);

    var t2 = document.createElement("div");
    t2.className = "section-title";
    t2.textContent = "Recommendations";
    frag.appendChild(t2);

    var visibleRecs = recommendations.filter(shouldShowRec);
    if (visibleRecs.length) {
      visibleRecs.forEach(function (r) { frag.appendChild(renderRecCard(r)); });
    } else {
      var empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = recommendations.length ? "All recommendations dismissed within the last 14 days." : "No recommendations today.";
      frag.appendChild(empty);
    }

    el.appendChild(frag);
  })();

  // ---------- Positions tab ----------
  (function buildPositions() {
    var el = panels.positions;
    var toolbar = document.createElement("div");
    toolbar.className = "positions-toolbar";
    toolbar.innerHTML = '<span class="label">Sort by</span>';
    var sorts = [
      { key: "value", label: "Value", fn: function (a, b) { return (b.market_value || 0) - (a.market_value || 0); } },
      { key: "gain", label: "% gain/loss", fn: function (a, b) { return (b.unrealized_pl_pct || 0) - (a.unrealized_pl_pct || 0); } },
      { key: "alpha", label: "Alphabetical", fn: function (a, b) { return a.ticker.localeCompare(b.ticker); } }
    ];
    var listEl = document.createElement("div");
    listEl.className = "position-list";

    function renderList(sortKey) {
      var sortDef = sorts.filter(function (s) { return s.key === sortKey; })[0] || sorts[0];
      var list = positions.slice().sort(sortDef.fn);
      listEl.innerHTML = "";
      if (!list.length) {
        var empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = "No positions available.";
        listEl.appendChild(empty);
        return;
      }
      list.forEach(function (p) { listEl.appendChild(renderPositionCard(p)); });
    }

    sorts.forEach(function (s) {
      var b = document.createElement("button");
      b.className = "sort-btn" + (s.key === "value" ? " active" : "");
      b.textContent = s.label;
      b.type = "button";
      b.addEventListener("click", function () {
        toolbar.querySelectorAll(".sort-btn").forEach(function (x) { x.classList.remove("active"); });
        b.classList.add("active");
        renderList(s.key);
      });
      toolbar.appendChild(b);
    });

    el.appendChild(toolbar);
    el.appendChild(listEl);
    renderList("value");
  })();

  function renderPositionCard(p) {
    var card = document.createElement("div");
    card.className = "card position-card";
    var rsiFlag = "";
    if (typeof p.rsi === "number") {
      if (p.rsi < 30) rsiFlag = '<span class="detail-flag warn">Oversold</span>';
      else if (p.rsi > 70) rsiFlag = '<span class="detail-flag warn">Overbought</span>';
    }
    var head = document.createElement("button");
    head.type = "button";
    head.className = "position-head";
    head.innerHTML =
      '<span class="pos-ticker">' + esc(p.ticker) + '</span>' +
      '<span class="pos-price-block"><span class="cur num">' + fmtUSD(p.current_price, { noSign: true }) + '</span><span class="cost num">cost ' + fmtUSD(p.avg_cost_per_share, { noSign: true }) + '</span></span>' +
      '<span class="pos-target-block"><span class="lbl">12mo target</span><span class="val num">' + (typeof p.analyst_target === "number" ? fmtUSD(p.analyst_target, { noSign: true }) : esc(p.analyst_target || "no consensus available")) + '</span></span>' +
      '<span class="pos-mv-block"><span class="mv num">' + fmtUSD(p.market_value, { noSign: true }) + '</span><span class="shares num">' + (p.shares != null ? Number(p.shares).toLocaleString("en-US", { maximumFractionDigits: 2 }) : "—") + ' sh</span></span>' +
      '<span class="pos-chip ' + signClass(p.today_pct) + '">' + fmtPct(p.today_pct) + '</span>' +
      '<span class="chevron">▸</span>';
    head.addEventListener("click", function () { card.classList.toggle("open"); });
    card.appendChild(head);

    var detail = document.createElement("div");
    detail.className = "position-detail";
    var supportLv = fmtLevels(p.support, ["s1", "s2", "s3"]);
    var resistanceLv = fmtLevels(p.resistance, ["r1", "r2", "r3"]);
    var newsHtml = (p.news && p.news.length)
      ? '<ul class="news-list">' + p.news.map(renderNewsItem).join("") + "</ul>"
      : '<div class="no-news">No recent news captured for this position.</div>';
    detail.innerHTML =
      '<div class="detail-grid">' +
        '<div class="detail-item"><div class="lbl">Support</div><div class="val num">' + supportLv.main + '</div>' + (supportLv.sub ? '<div class="val-sub num">' + supportLv.sub + '</div>' : '') + '</div>' +
        '<div class="detail-item"><div class="lbl">Resistance</div><div class="val num">' + resistanceLv.main + '</div>' + (resistanceLv.sub ? '<div class="val-sub num">' + resistanceLv.sub + '</div>' : '') + '</div>' +
        '<div class="detail-item"><div class="lbl">RSI</div><div class="val num">' + (typeof p.rsi === "number" ? p.rsi.toFixed(1) : "—") + rsiFlag + '</div></div>' +
        '<div class="detail-item"><div class="lbl">Next earnings</div><div class="val">' + esc(p.next_earnings || "—") + '</div></div>' +
        '<div class="detail-item"><div class="lbl">Unrealized P/L</div><div class="val num ' + signClass(p.unrealized_pl) + '">' + fmtUSD(p.unrealized_pl) + (typeof p.unrealized_pl_pct === "number" ? " (" + fmtPct(p.unrealized_pl_pct) + ")" : "") + '</div></div>' +
        '<div class="detail-item"><div class="lbl">Portfolio weight</div><div class="val num">' + (typeof p.portfolio_weight_pct === "number" ? p.portfolio_weight_pct.toFixed(1) + "%" : "—") + '</div></div>' +
      "</div>" + newsHtml;
    card.appendChild(detail);
    return card;
  }

  // ---------- Watchlist & News tab ----------
  (function buildWatchlist() {
    var el = panels.watchlist;
    var withNews = positions.filter(function (p) { return p.news && p.news.length; });

    var t = document.createElement("div");
    t.className = "section-title";
    t.textContent = "Flagged activity, newest first";
    el.appendChild(t);

    if (!withNews.length) {
      var empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = "No positions triggered a news search today (nothing moved >3%, no near-term earnings, no active flags).";
      el.appendChild(empty);
      return;
    }

    withNews.forEach(function (p) {
      var tags = [];
      if (typeof p.rsi === "number" && p.rsi < 30) tags.push('<span class="tag oversold">Oversold RSI ' + p.rsi.toFixed(1) + '</span>');
      if (typeof p.rsi === "number" && p.rsi > 70) tags.push('<span class="tag overbought">Overbought RSI ' + p.rsi.toFixed(1) + '</span>');
      if (p.next_earnings) tags.push('<span class="tag catalyst">Earnings ' + esc(p.next_earnings) + '</span>');
      var rec = recommendations.filter(function (r) { return r.ticker === p.ticker; })[0];
      if (rec && rec.rec_type === "risk-change") tags.push('<span class="tag risk">Risk change</span>');
      if (rec && (rec.rec_type === "trim")) tags.push('<span class="tag risk">Trim flag</span>');

      var item = document.createElement("div");
      item.className = "card feed-item";
      item.innerHTML =
        '<div class="feed-ticker-col"><span class="t">' + esc(p.ticker) + '</span>' +
        '<span class="pos-chip ' + signClass(p.today_pct) + '" style="min-width:auto;">' + fmtPct(p.today_pct) + '</span></div>' +
        '<div class="feed-body">' +
          '<div class="feed-tags">' + tags.join("") + '</div>' +
          '<ul class="news-list">' + p.news.map(renderNewsItem).join("") + '</ul>' +
          '<div class="feed-meta">Insider notes, where present, are best-effort search results, not verified SEC filings.</div>' +
        '</div>';
      el.appendChild(item);
    });
  })();

  // ---------- Notes footer ----------
  if (notes && notes.length) {
    var footer = document.getElementById("notes-footer");
    footer.style.display = "block";
    footer.innerHTML = "<strong>Data notes</strong><ul>" + notes.map(function (n) { return "<li>" + esc(n) + "</li>"; }).join("") + "</ul>";
  }
})();
</script>
